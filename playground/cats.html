<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cats</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/toy.css?v=20261122k">
<style>
  #gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  #gl.oncat { cursor: pointer; }
  .toggle-panel { display: none; }
  .panel { padding-top: 14px; }
  .panel .close { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; padding: 0; font-size: 14px; line-height: 1; border-radius: 50%; }
  .fab { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; z-index: 12; background: var(--panel);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 12px; padding: 8px 12px; border-radius: 999px; }
  .fab[hidden] { display: none; }
  .catlist { list-style: none; margin: 6px 0 0; padding: 0; }
  .catlist li { display: grid; grid-template-columns: 16px auto 1fr; gap: 10px; align-items: center; padding: 6px 6px; margin: 0 -6px; border-radius: 6px; cursor: pointer; }
  .catlist li:hover { background: rgba(255, 255, 255, .06); }
  .catlist .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .22); }
  .catlist .nm { font-weight: 500; white-space: nowrap; }
  .catlist .st { color: var(--soft); font-size: 12px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .catlabel { position: fixed; left: 0; top: 0; z-index: 14; pointer-events: none; background: var(--panel); border: 1px solid var(--rule);
    border-radius: 999px; padding: 3px 10px; font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .25s; will-change: transform; }
  .catlabel.on { opacity: 1; }
  #hintbar { position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--soft);
    background: rgba(0, 0, 0, .4); padding: 5px 10px; border-radius: 999px; transition: opacity 1s; pointer-events: none; white-space: nowrap; }
  @media (max-width: 520px) { #hintbar { white-space: normal; width: max-content; max-width: calc(100vw - 32px); text-align: center; } }
  .catlist li[hidden] { display: none; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 10px; }
  .modes button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; padding: 8px 4px 7px; font-size: 12px; line-height: 1.2; text-align: center; }
  .modes button { position: relative; }
  .modes button[data-tip]::after { content: attr(data-tip); position: absolute; top: calc(100% + 6px); left: 50%; transform: translate(-50%, -3px); padding: 4px 8px; border-radius: 5px; background: rgba(8, 9, 11, .92); border: 1px solid var(--rule); color: var(--ink); font-size: 11.5px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .15s, transform .15s; z-index: 2; }
  .modes button[data-tip]:hover::after, .modes button[data-tip]:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
  .modes svg { display: block; height: 14px; width: auto; border-radius: 2px; flex: none; }
  .modes button:not(.on) svg.paw { opacity: .8; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="hintbar">Drag to look around · click the floor to put down food · click a cat to see its name</div>
<button class="fab" id="openPanel" hidden>☰ Menu</button>

<div class="panel" id="panel">
  <button class="close" id="closePanel" aria-label="Close panel" title="Close (H)">✕</button>
  <a class="back" href="../index.html">← Home</a>
  <h1>Cats</h1>
  <p class="sub">Lenny 1, Lenny 2, Edna, Dolly and Frank. Click the floor to put down food.</p>
  <div class="modes" id="modes" role="group" aria-label="Which cats"></div>
  <ul class="catlist" id="catList"></ul>
  <p class="hint" style="margin-top:12px">Drag to look around, scroll or pinch to zoom. Click a cat, or a name above, to find it. <kbd>H</kbd> hides this panel.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================================================================
//  helpers
// ===================================================================
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const angWrap = (a) => Math.atan2(Math.sin(a), Math.cos(a));
function wpick(items) { let s = 0; for (const it of items) s += Math.max(0, it[0]); let r = Math.random() * s; for (const it of items) { r -= Math.max(0, it[0]); if (r <= 0 && it[0] > 0) return it[1]; } return items[0][1]; }
function mulberry(a) { return () => { a = (a + 0x6d2b79f5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash3 = (x, y, z) => { const s = Math.sin(x * 127.1 + y * 311.7 + z * 74.7) * 43758.5453; return s - Math.floor(s); };
function vnoise3(x, y, z) {
  const ix = Math.floor(x), iy = Math.floor(y), iz = Math.floor(z), fx = x - ix, fy = y - iy, fz = z - iz;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy), w = fz * fz * (3 - 2 * fz);
  let r = 0;
  for (let dz = 0; dz < 2; dz++) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++)
    r += hash3(ix + dx, iy + dy, iz + dz) * (dx ? u : 1 - u) * (dy ? v : 1 - v) * (dz ? w : 1 - w);
  return r;
}

// ===================================================================
//  renderer, scene, lights (warm, soft, low-poly)
// ===================================================================
const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1613);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 80);

const hemi = new THREE.HemisphereLight(0xfff0dc, 0x8a6a50, 0.62); scene.add(hemi);
const sunL = new THREE.DirectionalLight(0xffe3bd, 0.7);
sunL.position.set(-2.4, 6.5, -4.0); sunL.target.position.set(0, 0, 0.2);
sunL.castShadow = true; sunL.shadow.mapSize.set(2048, 2048);
Object.assign(sunL.shadow.camera, { left: -4.6, right: 4.6, top: 4.6, bottom: -4.6, near: 1, far: 16 });
sunL.shadow.bias = -0.0006; sunL.shadow.normalBias = 0.015;
scene.add(sunL, sunL.target);
const fillL = new THREE.DirectionalLight(0xc9d8ff, 0.18); fillL.position.set(5, 3, 6); scene.add(fillL);

const matCache = new Map();
function M(color, opts) {   // flat-shaded matte material
  const key = color + JSON.stringify(opts || {});
  if (!opts && matCache.has(key)) return matCache.get(key);
  const m = new THREE.MeshStandardMaterial(Object.assign({ color, roughness: 0.92, metalness: 0, flatShading: true }, opts || {}));
  if (!opts) matCache.set(key, m);
  return m;
}
function mk(geo, mat, parent, x, y, z, cast = true, recv = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); m.castShadow = cast; m.receiveShadow = recv; parent.add(m); return m;
}
// chamfered box: a box with its edges pushed in (reads as soft low-poly upholstery)
function rbox(w, h, d, r, seg = 2) {
  const g = new THREE.BoxGeometry(w, h, d, seg, seg, seg), p = g.attributes.position;
  const hw = w / 2 - r, hh = h / 2 - r, hd = d / 2 - r, v = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i); c.set(clamp(v.x, -hw, hw), clamp(v.y, -hh, hh), clamp(v.z, -hd, hd));
    v.sub(c); if (v.lengthSq() > 0) v.setLength(r); v.add(c); p.setXYZ(i, v.x, v.y, v.z);
  }
  const ng = g.toNonIndexed(); ng.computeVertexNormals(); return ng;
}
function canvasTex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t; }

// ===================================================================
//  the room
// ===================================================================
const RX = 3, RZ = 2.5, RH = 2.6, WT = 0.08;
const WIN = { x0: -1.65, x1: -0.35, y0: 0.85, y1: 2.05 };
const SUN = { kx: 0.4, kz: 0.775 };       // sunlight: window point (wx, wy) lands on the floor at (wx + kx*wy, -RZ + kz*wy)
const sunFloor = (u, v) => { const wx = lerp(WIN.x0, WIN.x1, u), wy = lerp(WIN.y0, WIN.y1, v); return [wx + SUN.kx * wy, -RZ + SUN.kz * wy]; };
function sunAt(x, z) {
  const wy = (z + RZ) / SUN.kz, wx = x - SUN.kx * wy, u = (wx - WIN.x0) / (WIN.x1 - WIN.x0), v = (wy - WIN.y0) / (WIN.y1 - WIN.y0);
  if (u < 0 || u > 1 || v < 0 || v > 1) return 0;
  return smooth(0, 0.15, u) * smooth(1, 0.85, u) * smooth(0, 0.15, v) * smooth(1, 0.85, v);
}

const room = new THREE.Group(); scene.add(room);
const furniture = new THREE.Group(); scene.add(furniture);   // blocks floor clicks

// dollhouse base slab and plank floor
mk(new THREE.BoxGeometry(2 * RX + 2 * WT + 0.06, 0.14, 2 * RZ + 2 * WT + 0.06), M(0x8c6446), room, 0, -0.075, 0, false, true);
const floorTex = canvasTex(1024, 1024, (g) => {
  const r = mulberry(7), rows = 8, rh = 128, cols = ["#d4a46f", "#cf9d68", "#d9ad78", "#c9955f", "#d1a26c"];
  for (let i = 0; i < rows; i++) {
    let x = -r() * 700;
    while (x < 1024) {
      const len = 420 + r() * 520;
      g.fillStyle = cols[Math.floor(r() * cols.length)]; g.fillRect(x, i * rh, len, rh);
      g.fillStyle = "rgba(255,240,215,.10)"; g.fillRect(x, i * rh + 6, len, rh * 0.35);
      g.fillStyle = "rgba(110,66,30,.35)"; g.fillRect(x, i * rh, 3, rh);
      x += len;
    }
    g.fillStyle = "rgba(110,66,30,.4)"; g.fillRect(0, i * rh, 1024, 3);
  }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping; floorTex.repeat.set(2 * RX / 1.6, 2 * RZ / 1.6);
const floor = mk(new THREE.PlaneGeometry(2 * RX, 2 * RZ).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85 }), room, 0, 0, 0, false, true);

// rug: stacked low-poly ellipses
const rug = new THREE.Group(); rug.position.set(0.15, 0, 0.45); room.add(rug);
{
  const layers = [[1.45, 1.0, 0xd9785a], [1.33, 0.9, 0xf3e3c6], [1.22, 0.81, 0x5f9c9a], [0.95, 0.6, 0xf0d9a8], [0.82, 0.5, 0xd9785a], [0.45, 0.27, 0xf3e3c6]];
  layers.forEach(([a, b, col], i) => {
    const m = mk(new THREE.CircleGeometry(1, 22).rotateX(-Math.PI / 2), M(col), rug, 0, 0.004 + i * 0.0012, 0, false, true);
    m.scale.set(a, 1, b); m.userData.floor = true;
  });
  for (let k = 0; k < 14; k++) {   // mustard dots in the teal band
    const a = k / 14 * Math.PI * 2, d = mk(new THREE.CircleGeometry(0.045, 6).rotateX(-Math.PI / 2), M(0xe7b85c), rug, Math.cos(a) * 1.085, 0.0115, Math.sin(a) * 0.71, false, true);
    d.userData.floor = true;
  }
}

// walls: each hides when the camera is on its outside, like a dollhouse
const walls = [];
function wallGroup(axis, at, sign) { const g = new THREE.Group(); room.add(g); walls.push({ g, axis, at, sign }); return g; }
const wB = wallGroup("z", -RZ, 1), wL = wallGroup("x", -RX, 1), wR = wallGroup("x", RX, -1), wF = wallGroup("z", RZ, -1);
const wallMat = M(0xf0dcc0), wallMat2 = M(0xe9d3b4), skirtMat = M(0xfbf4e8);
{
  const bw = (x0, x1, y0, y1) => mk(new THREE.BoxGeometry(x1 - x0, y1 - y0, WT), wallMat, wB, (x0 + x1) / 2, (y0 + y1) / 2, -RZ - WT / 2, false, true);
  bw(-RX - WT, WIN.x0, 0, RH); bw(WIN.x1, RX + WT, 0, RH); bw(WIN.x0, WIN.x1, 0, WIN.y0); bw(WIN.x0, WIN.x1, WIN.y1, RH);
  mk(new THREE.BoxGeometry(WT, RH, 2 * RZ), wallMat2, wL, -RX - WT / 2, RH / 2, 0, false, true);
  mk(new THREE.BoxGeometry(WT, RH, 2 * RZ), wallMat2, wR, RX + WT / 2, RH / 2, 0, false, true);
  mk(new THREE.BoxGeometry(2 * RX + 2 * WT, RH, WT), wallMat, wF, 0, RH / 2, RZ + WT / 2, false, true);
  // skirting boards and a picture rail
  mk(new THREE.BoxGeometry(2 * RX, 0.09, 0.02), skirtMat, wB, 0, 0.045, -RZ + 0.01, false, true);
  mk(new THREE.BoxGeometry(0.02, 0.09, 2 * RZ), skirtMat, wL, -RX + 0.01, 0.045, 0, false, true);
  mk(new THREE.BoxGeometry(0.02, 0.09, 2 * RZ), skirtMat, wR, RX - 0.01, 0.045, 0, false, true);
  mk(new THREE.BoxGeometry(2 * RX, 0.09, 0.02), skirtMat, wF, 0, 0.045, RZ - 0.01, false, true);
  for (const [g, w, d, x, z] of [[wB, 2 * RX, 0.02, 0, -RZ + 0.01], [wF, 2 * RX, 0.02, 0, RZ - 0.01], [wL, 0.02, 2 * RZ, -RX + 0.01, 0], [wR, 0.02, 2 * RZ, RX - 0.01, 0]])
    mk(new THREE.BoxGeometry(w, 0.035, d), skirtMat, g, x, 2.2, z, false, true);
}

// window: frame, sky, curtains (the view outside changes with the mode)
let skyTex;
function drawSky(g, w, h, kind) {
  const gr = g.createLinearGradient(0, 0, 0, h);
  const top = kind === "us" ? "#86bfe6" : kind === "ch" ? "#7cb9e6" : "#8ec5e8", bot = kind === "us" ? "#f6d39c" : kind === "ch" ? "#e4f1f6" : "#f7e6c4";
  gr.addColorStop(0, top); gr.addColorStop(0.6, kind === "us" ? "#d9e9ee" : "#cde6f0"); gr.addColorStop(1, bot);
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = "#ffffff"; g.globalAlpha = 0.85;
  for (const [x, y, sz] of [[60, 50, 16], [80, 44, 20], [102, 52, 14], [196, 34, 12], [210, 30, 16]]) { g.beginPath(); g.arc(x, y, sz, 0, 7); g.fill(); }
  g.globalAlpha = 1;
  const poly = (pts, col) => { g.fillStyle = col; g.beginPath(); pts.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.fill(); };
  if (kind === "ch") {   // the Alps: snowy peaks over a green meadow, a few firs
    for (const [px, py, hw, col] of [[40, 95, 85, "#93a5bb"], [150, 62, 105, "#8197b0"], [236, 100, 80, "#9cadc1"]]) {
      poly([[px - hw, 215], [px, py], [px + hw, 215]], col);
      const sh = 0.32, sx = hw * sh, sy = (215 - py) * sh;
      poly([[px - sx, py + sy], [px, py], [px + sx, py + sy], [px + sx * 0.4, py + sy * 0.8], [px, py + sy * 1.05], [px - sx * 0.45, py + sy * 0.78]], "#f7f8fa");
    }
    poly([[0, 256], [0, 205], [70, 196], [150, 210], [256, 198], [256, 256]], "#86b874");
    for (const [x, y, sz] of [[30, 232, 22], [52, 238, 18], [200, 228, 24], [226, 236, 18]]) poly([[x - sz * 0.45, y + sz * 0.4], [x, y - sz], [x + sz * 0.45, y + sz * 0.4]], "#4f7f4f");
  } else if (kind === "us") {   // desert buttes, a big American landscape
    poly([[0, 256], [0, 210], [256, 206], [256, 256]], "#e8b77a");
    for (const [x0, x1, top, col] of [[10, 90, 150, "#c8643c"], [120, 160, 120, "#b4532f"], [180, 250, 165, "#cf7446"]]) poly([[x0, 212], [x0 + 10, top + 8], [x0 + 16, top], [x1 - 16, top], [x1 - 10, top + 8], [x1, 212]], col);
    g.fillStyle = "#5f9e5a"; g.fillRect(100, 205, 7, 34); g.fillRect(92, 214, 7, 12); g.fillRect(107, 210, 7, 12);
  } else {
    const trees = [[20, 230, 60, "#7fae6a"], [80, 245, 50, "#6b9d5c"], [170, 235, 64, "#86b874"], [240, 250, 48, "#6b9d5c"]];
    for (const [x, y, sz, c] of trees) { g.fillStyle = c; g.beginPath(); for (let k = 0; k < 7; k++) { const a = Math.PI + k / 6 * Math.PI; g.lineTo(x + Math.cos(a) * sz, y + Math.sin(a) * sz * 1.1); } g.fill(); }
  }
}
function setSky(kind) { const c = skyTex.image; drawSky(c.getContext("2d"), c.width, c.height, kind); skyTex.needsUpdate = true; }
{
  const cx = (WIN.x0 + WIN.x1) / 2, cy = (WIN.y0 + WIN.y1) / 2, W = WIN.x1 - WIN.x0, H = WIN.y1 - WIN.y0, fr = M(0xfbf7ef), fw = 0.06;
  mk(new THREE.BoxGeometry(W + 2 * fw, fw, 0.14), fr, wB, cx, WIN.y1 + fw / 2, -RZ - 0.02);
  mk(new THREE.BoxGeometry(fw, H + 2 * fw, 0.14), fr, wB, WIN.x0 - fw / 2, cy, -RZ - 0.02);
  mk(new THREE.BoxGeometry(fw, H + 2 * fw, 0.14), fr, wB, WIN.x1 + fw / 2, cy, -RZ - 0.02);
  mk(new THREE.BoxGeometry(W + 0.24, 0.045, 0.2), fr, wB, cx, WIN.y0 - 0.022, -RZ + 0.03);
  mk(new THREE.BoxGeometry(0.035, H, 0.04), fr, wB, cx, cy, -RZ - 0.04);
  mk(new THREE.BoxGeometry(W, 0.035, 0.04), fr, wB, cx, cy + 0.08, -RZ - 0.04);
  const sky = skyTex = canvasTex(256, 256, (g, w, h) => drawSky(g, w, h, "all"));
  mk(new THREE.PlaneGeometry(W + 0.5, H + 0.5), new THREE.MeshBasicMaterial({ map: sky }), wB, cx, cy, -RZ - 0.3, false, false);
  mk(new THREE.CylinderGeometry(0.014, 0.014, W + 1.0, 6).rotateZ(Math.PI / 2), M(0x6b5544), wB, cx, WIN.y1 + 0.2, -RZ + 0.07);
  const curtMat = M(0xe2ac5c, { side: THREE.DoubleSide });
  for (const side of [-1, 1]) {
    const cw = 0.42, ch = WIN.y1 + 0.2 - 0.62, g = new THREE.PlaneGeometry(cw, ch, 8, 1), p = g.attributes.position;
    for (let i = 0; i < p.count; i++) { const x = p.getX(i), y = p.getY(i); const k = (y + ch / 2) / ch; p.setZ(i, Math.sin((x / cw + 0.5) * Math.PI * 4) * 0.03); p.setX(i, x * (0.75 + 0.25 * k)); }
    g.computeVertexNormals();
    mk(g, curtMat, wB, side < 0 ? WIN.x0 - 0.17 : WIN.x1 + 0.17, WIN.y1 + 0.2 - ch / 2, -RZ + 0.08, true, true);
  }
}

// pictures
function picture(parent, w, h, x, y, z, ry, paint) {
  const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry; parent.add(g);
  mk(new THREE.BoxGeometry(w + 0.06, h + 0.06, 0.03), M(0x7d5a3f), g, 0, 0, 0.015, false, true);
  mk(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: canvasTex(256, Math.round(256 * h / w), paint), roughness: 0.9 }), g, 0, 0, 0.032, false, true);
  return g;
}
const hillsPaint = (g, w, h) => {
  g.fillStyle = "#f6d9a8"; g.fillRect(0, 0, w, h);
  g.fillStyle = "#f2a76b"; g.beginPath(); g.arc(w * 0.68, h * 0.38, w * 0.12, 0, 7); g.fill();
  const band = (y0, c, amp, ph) => { g.fillStyle = c; g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 16) g.lineTo(x, h * y0 + Math.sin(x / w * 6 + ph) * amp); g.lineTo(w, h); g.fill(); };
  band(0.55, "#9cbf8a", 14, 1); band(0.68, "#6f9f74", 12, 3); band(0.82, "#4f7f66", 10, 5);
};
const sofaPicture = picture(wL, 0.8, 0.55, -RX + 0.005, 1.5, 0.5, Math.PI / 2, hillsPaint);
function drawSwiss(g, w, h) {   // square red flag, white cross: arms 6/32 wide, 20/32 across
  g.fillStyle = "#da291c"; g.fillRect(0, 0, w, h);
  const u = w / 32; g.fillStyle = "#ffffff"; g.fillRect(13 * u, 6 * u, 6 * u, 20 * u); g.fillRect(6 * u, 13 * u, 20 * u, 6 * u);
}
function drawUS(g, w, h) {   // 13 stripes, blue canton over 7 of them, 50 stars as dots
  const sh = h / 13;
  for (let i = 0; i < 13; i++) { g.fillStyle = i % 2 ? "#ffffff" : "#b22234"; g.fillRect(0, i * sh, w, sh + 0.6); }
  const cw = w * 0.4, chh = sh * 7; g.fillStyle = "#3c3b6e"; g.fillRect(0, 0, cw, chh);
  g.fillStyle = "#ffffff";
  for (let r = 0; r < 9; r++) for (let k = 0; k < (r % 2 ? 5 : 6); k++) { g.beginPath(); g.arc(cw * ((r % 2 ? 2 : 1) + k * 2) / 12, chh * (r + 1) / 10, chh * 0.03, 0, 7); g.fill(); }

    else if (Math.hypot(x - o.c[0], z - o.c[1]) < o.c[2] + inf) return true;

      if (p.x > x0 && p.x < x1 && p.z > z0 && p.z < z1) {
        const dl = p.x - x0, dr = x1 - p.x, dn = p.z - z0, df = z1 - p.z, m = Math.min(dl, dr, dn, df);
        if (m === dl) p.x = x0; else if (m === dr) p.x = x1; else if (m === dn) p.z = z0; else p.z = z1;

}

$("closePanel").onclick = () => setPanel(false);
openBtn.onclick = () => setPanel(true);
addEventListener("keydown", (e) => { if (e.key === "h" || e.key === "H") setPanel(panel.classList.contains("hidden")); });
const isTouch = matchMedia("(pointer: coarse)").matches;
setPanel(!(innerWidth < 760 || isTouch));
if (isTouch) {
  $("hintbar").textContent = "Drag to look around · tap the floor to put down food · tap a cat to see its name";
}
setTimeout(() => $("hintbar").style.opacity = 0, 10000);

const listEl = $("catList");
for (const c of allCats) {
  const li = document.createElement("li");
  li.title = c.def.desc;
  li.innerHTML = `<span class="sw" style="background:${c.def.sw}"></span><span class="nm">${c.name}</span><span class="st"></span>`;
  li.onclick = () => { showLabel(c, 5); cam.follow = c; cam.followT = 6; cam.idle = 0; if (innerWidth < 760) setPanel(false); };
  listEl.appendChild(li); c.li = li.querySelector(".st"); c.row = li;
}
// ---- modes: everyone, the Swiss cats, or the American cats
const MODES = {
  all: { label: "All the kitties", names: null },
  ch: { label: "Switzerland", names: ["Lenny 1", "Lenny 2", "Edna", "Fläckli"] },
  us: { label: "America", names: ["Dolly", "Frank"], tip: "Leslie mode" },
};
const usSvg = (() => {
  let t = '<svg viewBox="0 0 190 100" aria-hidden="true">';
  for (let i = 0; i < 13; i++) t += `<rect y="${(i * 100 / 13).toFixed(2)}" width="190" height="${(100 / 13 + 0.4).toFixed(2)}" fill="${i % 2 ? "#fff" : "#b22234"}"/>`;
  t += '<rect width="76" height="53.85" fill="#3c3b6e"/>';
  for (let r = 0; r < 9; r++) for (let k = 0; k < (r % 2 ? 5 : 6); k++) t += `<circle cx="${(76 * ((r % 2 ? 2 : 1) + k * 2) / 12).toFixed(1)}" cy="${(53.85 * (r + 1) / 10).toFixed(1)}" r="2.6" fill="#fff"/>`;
  return t + "</svg>";
})();
const MODE_ICONS = {
  all: '<svg class="paw" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><ellipse cx="12" cy="16.5" rx="5.2" ry="4.4"/><circle cx="5.6" cy="10.5" r="2.3"/><circle cx="9.6" cy="6.4" r="2.3"/><circle cx="14.4" cy="6.4" r="2.3"/><circle cx="18.4" cy="10.5" r="2.3"/></g></svg>',
  ch: '<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" fill="#da291c"/><rect x="13" y="6" width="6" height="20" fill="#fff"/><rect x="6" y="13" width="20" height="6" fill="#fff"/></svg>',
  us: usSvg,
};
let mode = "all";
$("modes").innerHTML = Object.entries(MODES).map(([k, m]) => `<button data-m="${k}" aria-pressed="false"${m.tip ? ` data-tip="${m.tip}" aria-description="${m.tip}"` : ""}>${MODE_ICONS[k]}<span>${m.label}</span></button>`).join("");
$("modes").querySelectorAll("button").forEach((b) => b.onclick = () => setMode(b.dataset.m));
function updateSub() {
  const n = cats.map((c) => c.name);
  const list = n.length > 1 ? n.slice(0, -1).join(", ") + " and " + n[n.length - 1] : n[0];
  panel.querySelector(".sub").textContent = `${list}. ${isTouch ? "Tap" : "Click"} the floor to put down food.`;
}
function leaveCat(c, instant) {
  clearPlan(c);
  for (const P of PERCHES) if (P.occ === c) P.occ = null;
  for (const b of bowls) releaseSpot(b, c);
  c.present = false; c.air = false; c.perch = null; c.goal = null; c.labelT = 0; c.label.classList.remove("on");
  if (hoverCat === c) hoverCat = null;
  if (cam.follow === c) { cam.follow = null; cam.followT = 0; }
  c.row.hidden = true;
  c.fade = instant ? 0 : 1; if (instant) c.root.visible = false;
}
function enterCat(c, instant) {
  c.present = true; c.row.hidden = false;
  c.perch = null; c.air = false; c.queue = []; c.step = null; c.speed = 0; c.playing = false; c.wake = false; c.afterMeal = false;
  const p = randomFloorPoint(c, null) || { x: rand(-1, 1), z: rand(0, 1) };
  c.pos.set(p.x, 0, p.z); c.heading = c.prevH = rand(-Math.PI, Math.PI);
  c.side = Math.random() < 0.5 ? -1 : 1; setPose(c, "sit"); snapPose(c);
  c.queue.push(poseStep("sit", rand(2, 5), { face: "cam" }));
  c.root.visible = true; c.fade = 0; c.pop = instant ? 1 : 0;
  c.root.scale.setScalar(c.def.scale * (instant ? 1 : 0.001));
}
function setMode(m, instant) {
  if (!MODES[m]) m = "all";
  mode = m;
  const want = MODES[m].names;
  for (const c of allCats) {
    const on = !want || want.includes(c.name);
    if (on && !c.present) enterCat(c, instant);
    else if (!on && c.present) leaveCat(c, instant);
  }
  cats.length = 0; cats.push(...allCats.filter((c) => c.present));
  $("modes").querySelectorAll("button").forEach((b) => { const on = b.dataset.m === m; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
  setFlag(m); setSky(m); updateSub();
  try { localStorage.setItem("cats-mode", m); } catch (e) {}
}
function initMode() { let m = "all"; try { m = localStorage.getItem("cats-mode") || "all"; } catch (e) {} setMode(m, true); }
// cats popping in and shrinking out when the mode changes
function updatePops(dt) {
  for (const c of allCats) {
    if (c.present && c.pop < 1) {
      c.pop = Math.min(1, c.pop + dt * 3);
      const t = c.pop - 1, k = 1 + 2.7 * t * t * t + 1.7 * t * t;   // ease out with a little overshoot
      c.root.scale.setScalar(c.def.scale * Math.max(0.001, k));
    } else if (!c.present && c.root.visible) {
      c.fade -= dt * 4;
      if (c.fade <= 0) { c.root.visible = false; c.root.scale.setScalar(c.def.scale); }
      else c.root.scale.setScalar(c.def.scale * c.fade);
    }
  }
}
function statusOf(c) {
  const s = c.step; let st = "";
  if (s) st = s.status || (s.type === "pose" ? (s.nap ? "napping" : POSE_STATUS[s.pose] || "") : s.type === "eat" ? "eating" : s.type === "jump" ? "jumping" : "exploring");
  if (c.perch && !c.air && s && s.type !== "jump" && !/sofa|tree|box|bed/.test(st)) st += " " + c.perch.where;
  else if (!c.perch && c.sun > 0.4 && /napping|loafing|sitting|lying|grooming/.test(st)) st += " in the sun";
  if (hungry(c) && !/food|eating|hungry/.test(st)) st = "hungry, " + st;
  return st.charAt(0).toUpperCase() + st.slice(1);
}
function showLabel(c, secs) { c.labelT = Math.max(c.labelT, secs); }
let hoverCat = null;
function updateLabels(dt) {
  for (const c of cats) {
    c.labelT = Math.max(0, c.labelT - dt);
    const on = c.labelT > 0 || hoverCat === c;
    c.label.classList.toggle("on", on);
    if (!on && c.label.style.opacity === "0") continue;
    c.headPivot.getWorldPosition(_w); _w.y += 0.2 * c.s;
    _w.project(camera);
    if (_w.z > 1) { c.label.classList.remove("on"); continue; }
    const x = (_w.x * 0.5 + 0.5) * innerWidth, y = (-_w.y * 0.5 + 0.5) * innerHeight;
    c.label.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px) translate(-50%, -100%)`;
  }
}

// ===================================================================
//  camera: drag to orbit, wheel / pinch zoom, slow drift when idle
// ===================================================================
const CAM_TARGET = new THREE.Vector3(0.05, 0.3, 0.1);
const cam = { th: 0.62, ph: 0.98, r: 7.3, target: CAM_TARGET.clone(), idle: 0, follow: null, followT: 0 };
const pointers = new Map();
let drag = null, pinch = null;
const gl = renderer.domElement;
gl.addEventListener("pointerdown", (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); gl.setPointerCapture(e.pointerId);
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now() };
  else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), r: cam.r }; drag = null; }
  $("hintbar").style.opacity = 0;
});
gl.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) { if (e.pointerType === "mouse") hover(e); return; }
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) { const [a, b] = [...pointers.values()]; cam.r = clamp(pinch.r * pinch.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), 1.6, 10); cam.idle = 0; return; }
  if (!drag) return;
  cam.th -= (e.clientX - drag.x) * 0.006; cam.ph = clamp(cam.ph - (e.clientY - drag.y) * 0.005, 0.25, 1.42);
  drag.x = e.clientX; drag.y = e.clientY; cam.idle = 0;
});
const endPointer = (e) => {
  pointers.delete(e.pointerId);
  if (drag && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7 && performance.now() - drag.t < 450) click(e);
  if (pointers.size < 2) pinch = null;
  drag = null;
};
gl.addEventListener("pointerup", endPointer); gl.addEventListener("pointercancel", endPointer);
gl.addEventListener("pointerleave", () => { hoverCat = null; gl.classList.remove("oncat"); });
gl.addEventListener("wheel", (e) => { e.preventDefault(); cam.r = clamp(cam.r * Math.exp(e.deltaY * 0.001), 1.6, 10); cam.idle = 0; }, { passive: false });

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function setRay(e) { ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); raycaster.setFromCamera(ndc, camera); }
function catAt(e) { setRay(e); const h = raycaster.intersectObjects(catMeshes, false).find((x) => x.object.userData.cat.present); return h ? h.object.userData.cat : null; }
let lastHover = 0;
function hover(e) {
  const now = performance.now(); if (now - lastHover < 60) return; lastHover = now;
  hoverCat = catAt(e); gl.classList.toggle("oncat", !!hoverCat);
}
const floorHits = [floor, ...rug.children];
function click(e) {
  const c = catAt(e);
  if (c) { showLabel(c, 3.5); return; }
  setRay(e);
  const hit = raycaster.intersectObjects([...floorHits, furniture], true)[0];
  if (hit && (hit.object === floor || hit.object.userData.floor)) dropFood(hit.point.x, hit.point.z);
}

// ===================================================================
//  loop
// ===================================================================
let viewOff = -1;
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 58 : 40; camera.updateProjectionMatrix(); viewOff = -1;
  if (innerWidth < innerHeight) cam.r = Math.max(cam.r, 9.2);
}
addEventListener("resize", resize);

const tmpP = new THREE.Vector3();
function update(dt, t) {
  for (const c of cats) updateCat(c, dt, t);
  updatePops(dt);
  // bowls: pop in, kibble shrinks as it is eaten, empty bowls fade away
  for (let i = bowls.length - 1; i >= 0; i--) {
    const b = bowls[i];
    b.pop = Math.min(1, b.pop + dt * 4); b.g.scale.setScalar(1 + Math.sin(b.pop * Math.PI) * 0.25);
    const n = Math.ceil(b.food / 1.6 * b.kib.length - 1e-6); b.kib.forEach((k, j) => k.visible = j < n);
    if (b.food <= 0.001 && !b.spots.length) { b.fadeT += dt; if (b.fadeT > 5) b.g.scale.setScalar(Math.max(0.001, 1 - (b.fadeT - 5) * 2)); if (b.fadeT > 5.5) removeBowl(b); }
  }
  // camera
  cam.idle += dt;
  if (cam.idle > 6 && !drag) { cam.th += dt * 0.025; cam.ph += (0.98 - cam.ph) * dt * 0.2; }
  if (cam.follow && cam.followT > 0) { cam.followT -= dt; cam.follow.root.getWorldPosition(tmpP); tmpP.y += 0.2; cam.target.lerp(tmpP, Math.min(1, dt * 2.5)); }
  else cam.target.lerp(CAM_TARGET, Math.min(1, dt * 0.8));
  const r = cam.r;
  camera.position.set(cam.target.x + r * Math.sin(cam.ph) * Math.sin(cam.th), cam.target.y + r * Math.cos(cam.ph), cam.target.z + r * Math.sin(cam.ph) * Math.cos(cam.th));
  camera.lookAt(cam.target);
  const off = !panel.classList.contains("hidden") && innerWidth > 760 ? (panel.offsetWidth + 16) / 2 : 0;
  if (off !== viewOff) { viewOff = off; if (off) camera.setViewOffset(innerWidth, innerHeight, -off, 0, innerWidth, innerHeight); else camera.clearViewOffset(); }
  for (const w of walls) w.g.visible = (camera.position[w.axis] - w.at) * w.sign > 0;
  // little touches: plants sway, dangling toy, dust in the sunbeam
  for (const s of swayers) s.o.rotation.x = s.base + Math.sin(t * 0.7 + s.ph) * s.amp;
  const td = toy.userData;
  for (const c of cats) if (!c.perch && Math.hypot(c.pos.x - 0.32, c.pos.z + 1.72) < 0.3 && c.speed > 0.05) { td.v += (Math.random() - 0.5) * 3 * dt; td.vb += (Math.random() - 0.5) * 3 * dt; }
  td.v += (-td.a * 30 - td.v * 0.6) * dt; td.a += td.v * dt; td.vb += (-td.b * 30 - td.vb * 0.6) * dt; td.b += td.vb * dt;
  toy.rotation.set(td.a, 0, td.b);
  const dp = dust.pos;
  dust.seeds.forEach((s, i) => {
    s.w = (s.w + dt * s.s * 0.4) % 1;
    const u = s.u + Math.sin(t * 0.3 + s.ph) * 0.03, v = s.v + Math.cos(t * 0.23 + s.ph) * 0.03;
    const wx = lerp(WIN.x0, WIN.x1, u), wy = lerp(WIN.y0, WIN.y1, v), k = s.w;
    dp[i * 3] = wx + SUN.kx * wy * k; dp[i * 3 + 1] = wy * (1 - k); dp[i * 3 + 2] = -RZ + SUN.kz * wy * k;
  });
  dust.pts.geometry.attributes.position.needsUpdate = true;
  updateLabels(dt);
}
let statusT = 0;
function updateStatus(dt) {
  if ((statusT -= dt) > 0) return; statusT = 0.4;
  for (const c of cats) { const s = statusOf(c); if (c.li.textContent !== s) c.li.textContent = s; }
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt, now / 1000); updateStatus(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
initMode();
resize();
requestAnimationFrame(frame);
</script>
<script>/* links to other websites open in a new tab */ document.querySelectorAll("a[href]").forEach((a) => { if (/^https?:$/.test(a.protocol) && a.origin !== location.origin) { a.target = "_blank"; a.rel = "noopener noreferrer"; } });</script>
