<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maze Lab</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/toy.css?v=20261122d">
<style>
  html, body { height: auto; }
  body { overflow: auto; }
  .wrap { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; padding: 14px 16px 16px; min-height: 100vh; box-sizing: border-box; }
  header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }
  header.top h1 { font-family: "Source Serif 4", Georgia, serif; font-weight: 600; font-size: 24px; margin: 0; }
  header.top .back { color: var(--soft); font-size: 11.5px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tabs button { padding: 7px 12px; }
  .spacer { flex: 1; }
  .labstage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  #boards { display: grid; gap: 10px; }
  #boards.multi { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .board { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 8px; }
  .board canvas { display: block; width: 100%; border-radius: 4px; touch-action: none; }
  .board .cap { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--soft); margin: 2px 2px 6px; }
  .board .cap b { color: var(--ink); font-weight: 500; }
  .board .stats { font-size: 11.5px; color: var(--soft); margin: 6px 2px 0; min-height: 16px; }
  .board .stats .ok { color: #7ee0a0; } .board .stats .bad { color: #ff8a7a; }
  #chartBox { display: none; }
  #chartBox.on { display: block; }
  #chart { width: 100%; height: 220px; display: block; }
  .side { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; overflow-y: auto; max-height: calc(100vh - 70px); position: sticky; top: 14px; align-self: start; }
  .side h2 { font-size: 13px; font-weight: 500; margin: 14px 0 6px; color: var(--accent); letter-spacing: .04em; }
  .side h2:first-child { margin-top: 0; }
  .side p { margin: 0 0 8px; line-height: 1.55; font-size: 12.5px; color: #cfd2d6; }
  .side .small { font-size: 11.5px; color: var(--soft); }
  .ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .ctl.three { grid-template-columns: repeat(3, 1fr); }
  .ctl select, .ctl button { width: 100%; }
  .transport { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .transport input[type=range] { flex: 1; min-width: 120px; }
  .algos { display: flex; flex-wrap: wrap; gap: 6px; }
  .algos button { padding: 6px 9px; }
  .props { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; margin: 6px 0 8px; }
  .props span:nth-child(odd) { color: var(--soft); }
  pre.code { background: rgba(0,0,0,.3); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 10px; font-size: 11.5px; line-height: 1.6; margin: 6px 0 8px; white-space: pre-wrap; }
  pre.code .ln { display: block; border-radius: 4px; padding: 0 4px; }
  pre.code .ln.hl { background: rgba(224,179,90,.22); color: #fff; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--soft); margin: 4px 0; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  table.sum { width: 100%; border-collapse: collapse; font-size: 11.5px; margin: 6px 0; }
  table.sum td, table.sum th { padding: 3px 4px; border-bottom: 1px solid var(--rule); text-align: right; }
  table.sum td:first-child, table.sum th:first-child { text-align: left; }
  table.sum th { color: var(--soft); font-weight: 400; }
  .takeaway { border-left: 2px solid var(--accent); padding: 4px 0 4px 10px; margin: 8px 0; font-size: 12.5px; color: #e9e6df; }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; }
    .side { position: static; max-height: none; }
    #boards.multi { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 560px) { #boards.multi { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="back" href="../index.html">← home</a>
    <h1>maze lab</h1>
    <div class="tabs" id="tabs">
      <button data-tab="known" class="on">1 · search a known map</button>
      <button data-tab="unknown">2 · explore without a map</button>
      <button data-tab="team">3 · many agents</button>
    </div>
    <span class="spacer"></span>
    <a href="maze3d.html" style="font-size:12px">3D walk-through →</a>
  </header>

  <section class="labstage">
    <div id="boards"></div>
    <div class="board" id="chartBox"><div class="cap"><b>cells discovered over time</b><span id="chartNote"></span></div><canvas id="chart"></canvas></div>
  </section>

  <aside class="side">
    <h2>maze</h2>
    <div class="ctl three">
      <select id="mazeType" aria-label="Maze type">
        <option value="perfect">perfect maze</option>
        <option value="loops">maze with loops</option>
        <option value="rooms">rooms</option>
        <option value="field">open field</option>
        <option value="empty">empty</option>
      </select>
      <select id="mazeSize" aria-label="Maze size">
        <option value="21x13">small</option>
        <option value="41x25" selected>medium</option>
        <option value="61x37">large</option>
      </select>
      <button id="newMaze">new maze</button>
    </div>
    <div class="ctl" style="margin-top:6px" id="editRow">
      <select id="paint" aria-label="Paint mode">
        <option value="wall">draw: walls</option>
        <option value="mud">draw: mud (cost 5)</option>
        <option value="erase">draw: erase</option>
      </select>
      <button id="mudBtn">sprinkle mud</button>
    </div>
    <p class="small" style="margin-top:6px">Drag on the maze to draw. Drag the green start or red goal to move them.</p>

    <div id="algoBlock"></div>

    <h2>run</h2>
    <div class="transport">
      <button id="play" class="on">▶ play</button>
      <button id="stepBtn">step</button>
      <button id="reset">reset</button>
      <label style="margin:0;display:flex;gap:6px;align-items:center;flex:1">speed<input type="range" id="speed" min="0" max="100" value="45"></label>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--ink)"><input type="checkbox" id="compare"> compare all side by side</label>

    <div id="explain"></div>
    <div id="summary"></div>
  </aside>
</div>

<script>
// ===================================================================
//  grid + maze generation
// ===================================================================
const FREE = 0, WALL = 1, MUD = 2;
const G = { cols: 41, rows: 25, cells: null, start: 0, goal: 0 };
const idx = (x, y) => y * G.cols + x;
const XY = (i) => [i % G.cols, (i / G.cols) | 0];
const cost = (i) => (G.cells[i] === MUD ? 5 : 1);
const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
function nbrs(i, cells = G.cells) {
  const x = i % G.cols, y = (i / G.cols) | 0, out = [];
  for (let d = 0; d < 4; d++) {
    const nx = x + DX[d], ny = y + DY[d];
    if (nx < 0 || ny < 0 || nx >= G.cols || ny >= G.rows) continue;
    const j = ny * G.cols + nx; if (cells[j] !== WALL) out.push(j);
  }
  return out;
}
const manhattan = (a, b) => Math.abs(a % G.cols - b % G.cols) + Math.abs(((a / G.cols) | 0) - ((b / G.cols) | 0));
let rng = Math.random;
const rint = (n) => Math.floor(rng() * n);
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rint(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function genMaze(type) {
  const C = G.cols, R = G.rows, cells = new Uint8Array(C * R).fill(WALL);
  const setFree = (x, y) => { cells[y * C + x] = FREE; };
  const border = () => { for (let x = 0; x < C; x++) { cells[x] = WALL; cells[(R - 1) * C + x] = WALL; } for (let y = 0; y < R; y++) { cells[y * C] = WALL; cells[y * C + C - 1] = WALL; } };
  if (type === "perfect" || type === "loops") {
    const seen = new Uint8Array(C * R), st = [[1, 1]]; setFree(1, 1); seen[C + 1] = 1;
    while (st.length) {
      const [x, y] = st[st.length - 1], opts = [];
      for (let d = 0; d < 4; d++) { const nx = x + DX[d] * 2, ny = y + DY[d] * 2; if (nx > 0 && ny > 0 && nx < C - 1 && ny < R - 1 && !seen[ny * C + nx]) opts.push(d); }
      if (!opts.length) { st.pop(); continue; }
      const d = opts[rint(opts.length)], nx = x + DX[d] * 2, ny = y + DY[d] * 2;
      setFree(x + DX[d], y + DY[d]); setFree(nx, ny); seen[ny * C + nx] = 1; st.push([nx, ny]);
    }
    if (type === "loops") {
      for (let y = 1; y < R - 1; y++) for (let x = 1; x < C - 1; x++) {
        if (cells[y * C + x] !== WALL || rng() > 0.11) continue;
        const h = cells[y * C + x - 1] === FREE && cells[y * C + x + 1] === FREE, v = cells[(y - 1) * C + x] === FREE && cells[(y + 1) * C + x] === FREE;
        if (h !== v) setFree(x, y);
      }
    }
  } else if (type === "rooms") {
    cells.fill(FREE); border();
    const divide = (x0, y0, x1, y1) => {   // recursive division on the interior [x0..x1]x[y0..y1]
      const w = x1 - x0 + 1, h = y1 - y0 + 1;
      if (w < 9 || h < 7) return;
      const horiz = h > w ? true : w > h ? false : rng() < .5;
      if (horiz) {
        const wy = y0 + 1 + 2 * rint(Math.floor((h - 2) / 2)), gaps = [x0 + 2 * rint(Math.ceil(w / 2)), x0 + 2 * rint(Math.ceil(w / 2))];
        for (let x = x0; x <= x1; x++) if (!gaps.includes(x)) cells[wy * C + x] = WALL;
        divide(x0, y0, x1, wy - 1); divide(x0, wy + 1, x1, y1);
      } else {
        const wx = x0 + 1 + 2 * rint(Math.floor((w - 2) / 2)), gaps = [y0 + 2 * rint(Math.ceil(h / 2)), y0 + 2 * rint(Math.ceil(h / 2))];
        for (let y = y0; y <= y1; y++) if (!gaps.includes(y)) cells[y * C + wx] = WALL;
        divide(x0, y0, wx - 1, y1); divide(wx + 1, y0, x1, y1);
      }
    };
    divide(1, 1, C - 2, R - 2);
  } else if (type === "field") {
    for (let tries = 0; tries < 30; tries++) {
      cells.fill(FREE); border();
      for (let b = 0; b < C * R / 14; b++) { const x = 1 + rint(C - 2), y = 1 + rint(R - 2), w = 1 + rint(3), h = 1 + rint(3); for (let yy = y; yy < Math.min(R - 1, y + h); yy++) for (let xx = x; xx < Math.min(C - 1, x + w); xx++) cells[yy * C + xx] = WALL; }
      cells[C + 1] = FREE; cells[(R - 2) * C + C - 2] = FREE;
      G.cells = cells; if (reachableFrom(C + 1)[(R - 2) * C + C - 2]) break;
    }
  } else { cells.fill(FREE); border(); }
  G.cells = cells;
  G.start = idx(1, 1); G.goal = idx(C - 2, R - 2);
  cells[G.start] = FREE; cells[G.goal] = FREE;
}
function sprinkleMud() {
  const C = G.cols, R = G.rows, seeds = Math.round(C * R / 120);
  for (let s = 0; s < seeds; s++) {
    const cx = 2 + rint(C - 4), cy = 2 + rint(R - 4), rad = 2 + rint(4);
    for (let y = cy - rad; y <= cy + rad; y++) for (let x = cx - rad; x <= cx + rad; x++) {
      if (x < 1 || y < 1 || x >= C - 1 || y >= R - 1) continue;
      const i = y * C + x; if (G.cells[i] === FREE && (x - cx) ** 2 + (y - cy) ** 2 <= rad * rad && i !== G.start && i !== G.goal) G.cells[i] = MUD;
    }
  }
}
function reachableFrom(s, cells = G.cells) {
  const seen = new Uint8Array(cells.length), q = [s]; seen[s] = 1;
  for (let h = 0; h < q.length; h++) for (const j of nbrs(q[h], cells)) if (!seen[j]) { seen[j] = 1; q.push(j); }
  return seen;
}

// binary heap (min) for priority queues
class Heap {
  constructor() { this.a = []; this.p = []; this.n = 0; this.c = 0; }
  get size() { return this.a.length; }
  push(v, pr) {
    const a = this.a, p = this.p; let i = a.length; a.push(v); p.push([pr, this.c++]);
    while (i > 0) { const j = (i - 1) >> 1; if (this.less(i, j)) { this.swap(i, j); i = j; } else break; }
  }
  less(i, j) { const x = this.p[i], y = this.p[j]; return x[0] < y[0] || (x[0] === y[0] && x[1] < y[1]); }
  swap(i, j) { [this.a[i], this.a[j]] = [this.a[j], this.a[i]]; [this.p[i], this.p[j]] = [this.p[j], this.p[i]]; }
  pop() {
    const a = this.a, top = a[0], last = a.pop(), lp = this.p.pop();
    if (a.length) { a[0] = last; this.p[0] = lp; let i = 0; for (;;) { const l = 2 * i + 1, r = l + 1; let m = i; if (l < a.length && this.less(l, m)) m = l; if (r < a.length && this.less(r, m)) m = r; if (m === i) break; this.swap(i, m); i = m; } }
    return top;
  }
}

// ===================================================================
//  tab 1: classic search on a known map (generators, one yield per event)
// ===================================================================
const ALGOS = {
  bfs: { name: "BFS", full: "breadth-first search", ds: "queue (first in, first out)", complete: "yes", optimal: "only if all steps cost the same", heur: "no",
    text: "Explores in rings of equal step-distance from the start. Every node at distance d is expanded before any node at distance d+1, so the first time it reaches the goal it has a path with the fewest steps. It ignores costs, so mud doesn't slow it down in its own mind, only in reality." ,
    pop: "n ← oldest node in the queue" },
  dfs: { name: "DFS", full: "depth-first search", ds: "stack (last in, first out)", complete: "yes, on a finite graph", optimal: "no", heur: "no",
    text: "Dives down one corridor as far as it can, and only backtracks at a dead end. It needs little memory, which made it the natural way to explore by hand. It finds a path, but often a long and winding one.",
    pop: "n ← newest node on the stack" },
  dijkstra: { name: "Dijkstra", full: "Dijkstra / uniform-cost search", ds: "priority queue by g (cost so far)", complete: "yes", optimal: "yes (non-negative costs)", heur: "no",
    text: "Always expands the cheapest-to-reach node. It grows in rings of equal cost rather than equal steps, so it walks around mud when that is cheaper. Optimal, but it searches in every direction, including away from the goal.",
    pop: "n ← node with the lowest g" },
  greedy: { name: "Greedy", full: "greedy best-first search", ds: "priority queue by h (estimated distance to goal)", complete: "yes, on a finite graph", optimal: "no", heur: "Manhattan distance",
    text: "Always expands whatever looks closest to the goal, ignoring how far it has already come. It can be lightning fast in open space, but walls fool it: it charges into dead ends that point the right way.",
    pop: "n ← node with the lowest h" },
  astar: { name: "A*", full: "A* search", ds: "priority queue by f = g + h", complete: "yes", optimal: "yes, with an admissible heuristic", heur: "Manhattan distance (never overestimates)",
    text: "Combines both ideas: cost so far plus a guess of the cost still to go. As long as the guess never overestimates (Manhattan distance can't on a 4-connected grid with step cost ≥ 1), A* finds an optimal path, and it usually expands far fewer nodes than Dijkstra because it leans toward the goal.",
    pop: "n ← node with the lowest g + h" },
};
const CODE = [
  ["init", "frontier ← { start }"],
  ["loop", "while frontier is not empty:"],
  ["pop", "    POP"],
  ["goal", "    if n is the goal: return path"],
  ["expand", "    for each neighbour m of n:"],
  ["push", "        if m is new (or now cheaper):\n            remember n as m's parent\n            add m to the frontier"],
  ["fail", "return 'no path'"],
];
function newSearch(alg) {
  const R = { kind: "search", alg, N: G.cells.length, expanded: 0, maxFrontier: 0, current: -1, path: null, cost: 0, done: false, failed: false, line: "init" };
  R.state = new Uint8Array(R.N); R.order = new Int32Array(R.N).fill(-1);
  R.gen = searchGen(R);
  return R;
}
function* searchGen(R) {
  const s = G.start, g = G.goal, N = R.N, A = R.alg;
  const parent = new Int32Array(N).fill(-1), gc = new Float64Array(N).fill(Infinity);
  const h = (i) => manhattan(i, g);
  let fr;   // frontier
  if (A === "bfs") fr = { q: [s], head: 0, push(v) { this.q.push(v); }, pop() { return this.q[this.head++]; }, get size() { return this.q.length - this.head; } };
  else if (A === "dfs") fr = { q: [s], push(v) { this.q.push(v); }, pop() { return this.q.pop(); }, get size() { return this.q.length; } };
  else { fr = new Heap(); fr.push(s, A === "greedy" ? h(s) : A === "astar" ? h(s) : 0); }
  gc[s] = 0; R.state[s] = 1; R.line = "init"; yield;
  while (fr.size) {
    R.line = "loop";
    const n = fr.pop();
    if (R.state[n] === 2) continue;           // stale entry
    R.state[n] = 2; R.order[n] = R.expanded++; R.current = n; R.line = "pop"; yield;
    if (n === g) {
      const path = []; for (let v = g; v !== -1; v = parent[v]) path.push(v); path.reverse();
      R.path = path; R.cost = path.slice(1).reduce((a, v) => a + cost(v), 0); R.line = "goal"; R.done = true; return;
    }
    R.line = "expand";
    for (const m of (A === "dfs" ? nbrs(n).reverse() : nbrs(n))) {
      if (R.state[m] === 2) continue;
      if (A === "bfs") { if (R.state[m] === 0) { R.state[m] = 1; parent[m] = n; fr.push(m); } }
      else if (A === "dfs") { parent[m] = n; R.state[m] = 1; fr.push(m); }
      else if (A === "greedy") { if (R.state[m] === 0) { R.state[m] = 1; parent[m] = n; fr.push(m, h(m)); } }
      else { const ng = gc[n] + cost(m); if (ng < gc[m]) { gc[m] = ng; parent[m] = n; R.state[m] = 1; fr.push(m, A === "astar" ? ng + h(m) * 1.001 : ng); } }   // tie-break toward the goal
    }
    R.maxFrontier = Math.max(R.maxFrontier, fr.size);
    R.line = "push"; yield;
  }
  R.line = "fail"; R.done = true; R.failed = true;
}
function optimalCost() {   // plain Dijkstra, for grading
  const N = G.cells.length, d = new Float64Array(N).fill(Infinity), H = new Heap(); d[G.start] = 0; H.push(G.start, 0);
  while (H.size) { const n = H.pop(); if (n === G.goal) return d[n]; for (const m of nbrs(n)) { const nd = d[n] + cost(m); if (nd < d[m]) { d[m] = nd; H.push(m, nd); } } }
  return Infinity;
}
function shortestSteps() {
  const seen = reachableFrom(G.start), dist = new Int32Array(G.cells.length).fill(-1), q = [G.start]; dist[G.start] = 0;
  for (let h = 0; h < q.length; h++) for (const j of nbrs(q[h])) if (dist[j] < 0) { dist[j] = dist[q[h]] + 1; q.push(j); }
  return dist[G.goal];
}

// ===================================================================
//  tab 2: one agent, unknown map (it only senses the four cells around it)
// ===================================================================
const EXPLORERS = {
  random: { name: "random walk", short: "random",
    text: "No memory at all: at every step pick a random open neighbour. It does find the exit eventually, but the expected number of steps grows much faster than the maze. A useful baseline for how much memory is worth." },
  wall: { name: "wall follower", short: "right hand",
    text: "Keep your right hand on the wall and walk. No memory beyond your heading. In a perfect maze (no loops) it always reaches the exit, because the walls form one connected piece. Once there are loops, an exit inside an island of walls can be circled forever: try 'maze with loops'." },
  tremaux: { name: "Trémaux", short: "Trémaux",
    text: "A 19th-century method with chalk: mark every passage you walk. Never enter a passage marked twice. If a fresh passage leads you to a junction you've already visited, turn around. It is guaranteed to find the exit in any maze and walks each passage at most twice. It is depth-first search, done with your feet." },
  dfsmem: { name: "DFS with memory", short: "DFS",
    text: "Remember which cells you've visited. Go to an unvisited neighbour if there is one, otherwise walk back the way you came. Systematic, never gets stuck in loops, but it doesn't know which direction the exit is." },
  optastar: { name: "optimistic A* (replanning)", short: "opt. A*",
    text: "Knows where the exit is (think GPS) but not the walls. It plans with A* as if every unknown cell were open, walks the plan, and replans whenever it bumps into a wall. This 'freespace assumption' is the core idea of D* Lite (Koenig & Likhachev, 2002), and D*-family planners have driven real robots and planetary rovers." },
};
function newExplorer(strat, opts = {}) {
  const N = G.cells.length;
  const a = { strat, pos: G.start, know: opts.sharedKnow || new Int8Array(N).fill(-1), visits: new Uint16Array(N), trail: [G.start], steps: 0, done: false, found: false, gaveUp: false,
    dir: 0, stack: [], mine: new Uint8Array(N), marks: new Map(), came: -1, plan: [], replans: 0, color: opts.color || "#e0b35a", idle: false, target: -1 };
  a.visits[G.start] = 1; a.mine[G.start] = 1;
  return a;
}
function sense(a, seenGlobal) {
  const x = a.pos % G.cols, y = (a.pos / G.cols) | 0;
  const mark = (i) => { a.know[i] = G.cells[i] === WALL ? 1 : 0; if (seenGlobal && !seenGlobal.s[i]) { seenGlobal.s[i] = 1; if (G.cells[i] !== WALL) seenGlobal.n++; } };
  mark(a.pos);
  for (let d = 0; d < 4; d++) { const nx = x + DX[d], ny = y + DY[d]; if (nx >= 0 && ny >= 0 && nx < G.cols && ny < G.rows) mark(ny * G.cols + nx); }
}

  } else {
    html += `<h2>team strategy</h2><div class="algos">${Object.entries(TEAMS).map(([k, a]) => `<button data-team="${k}" class="${k === teamStrat ? "on" : ""}">${a.name.replace(" (shared map)", "")}</button>`).join("")}</div>
      <label style="display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--ink)">agents <input type="range" id="kSlider" min="1" max="8" value="${teamK}" style="flex:1"><b id="kVal">${teamK}</b></label>`;
    html += `<h2>${TEAMS[teamStrat].name}</h2><p>${TEAMS[teamStrat].text}</p>
      <p class="small">Every agent sees only its four neighbours. The goal is to discover every reachable cell; time is measured in rounds where every agent takes one step. Small squares show where each agent is heading.</p>
      <h2>how much do more agents help?</h2>
      <p class="small">Runs each strategy with 1 to 8 agents on this maze and plots the time to explore everything.</p>
      <button id="speedupBtn">run the speedup experiment</button><canvas id="speedup" style="width:100%;height:190px;display:none;margin-top:8px"></canvas><p class="small" id="speedupNote"></p>`;
  }
  ex.innerHTML = html;
  ex.querySelectorAll("[data-alg]").forEach((b) => b.onclick = () => { alg = b.dataset.alg; compare = false; $("compare").checked = false; makeRuns(); });
  ex.querySelectorAll("[data-exp]").forEach((b) => b.onclick = () => { explorer = b.dataset.exp; compare = false; $("compare").checked = false; makeRuns(); });
  ex.querySelectorAll("[data-team]").forEach((b) => b.onclick = () => { teamStrat = b.dataset.team; compare = false; $("compare").checked = false; makeRuns(); });
  const ks = $("kSlider"); if (ks) ks.oninput = () => { teamK = +ks.value; $("kVal").textContent = teamK; makeRuns(); };
  const sb = $("speedupBtn"); if (sb) sb.onclick = speedupExperiment;
  highlightCode();
}
function highlightCode() {
  const R = runs[0]; if (!R || R.kind !== "search" || runs.length > 1) { document.querySelectorAll("#code .ln").forEach((l) => l.classList.remove("hl")); return; }
  document.querySelectorAll("#code .ln").forEach((l) => l.classList.toggle("hl", l.dataset.l === R.line));
}
function renderSummary() {
  const el = $("summary");
  if (runs.length < 2 || !runs.every((R) => R.done)) { el.innerHTML = ""; return; }
  let html = "<h2>results</h2>";
  if (tab === "known") {
    const opt = optCache;
    html += `<table class="sum"><tr><th>algorithm</th><th>expanded</th><th>cost</th><th>optimal?</th></tr>` +
      runs.map((R) => `<tr><td>${ALGOS[R.alg].name}</td><td>${R.expanded}</td><td>${R.failed ? "-" : R.cost}</td><td>${R.failed ? "-" : Math.abs(R.cost - opt) < 1e-9 ? "✓" : "✗"}</td></tr>`).join("") + "</table>";
    const a = runs.find((R) => R.alg === "astar"), d = runs.find((R) => R.alg === "dijkstra"), gr = runs.find((R) => R.alg === "greedy"), b = runs.find((R) => R.alg === "bfs");
    const notes = [];
    if (a && d) notes.push(`A* and Dijkstra both found cost ${a.cost}, but A* expanded ${a.expanded} nodes against Dijkstra's ${d.expanded} (${Math.round(100 - a.expanded / d.expanded * 100)}% fewer). That is the value of a good heuristic.`);
    if (gr && gr.cost > opt) notes.push(`Greedy expanded only ${gr.expanded} nodes but its path costs ${gr.cost} instead of ${opt}: fast, not optimal.`);
    if (b && b.cost > opt) notes.push(`BFS found the fewest steps, but it can't see mud, so its path costs ${b.cost}.`);
    html += notes.map((n) => `<div class="takeaway">${n}</div>`).join("");
  } else if (tab === "unknown") {
    html += `<table class="sum"><tr><th>strategy</th><th>steps</th><th>vs shortest</th></tr>` +
      runs.map((R) => `<tr><td>${EXPLORERS[R.strat].name}</td><td>${R.a.found ? R.a.steps : "—"}</td><td>${R.a.found ? (R.a.steps / R.optimal).toFixed(1) + "×" : R.a.gaveUp ? "failed" : "—"}</td></tr>`).join("") + "</table>";
    const best = runs.filter((R) => R.a.found).sort((x, y) => x.a.steps - y.a.steps)[0];
    if (best) html += `<div class="takeaway">Fastest here: ${EXPLORERS[best.strat].name} (${best.a.steps} steps; the shortest path is ${best.optimal}). Knowing where the goal is helps optimistic A* a lot; the others are blind to direction.</div>`;
    const wall = runs.find((R) => R.strat === "wall");
    if (wall && wall.a.gaveUp) html += `<div class="takeaway">The wall follower never got there: the exit is on an island of walls it can only circle around. That's why loops break the right-hand rule.</div>`;
  } else {
    html += `<table class="sum"><tr><th>strategy</th><th>time</th><th>total moves</th></tr>` +
      runs.map((R) => `<tr><td>${TEAMS[R.strat].name}</td><td>${R.seen.n >= R.total ? R.t : "—"}</td><td>${R.agents.reduce((s, a) => s + a.steps, 0)}</td></tr>`).join("") + "</table>";
    const c = runs.find((R) => R.strat === "coord"), n = runs.find((R) => R.strat === "nearest"), d = runs.find((R) => R.strat === "dfs");
    if (c && n && d) html += `<div class="takeaway">Sharing the map is what matters most: independent DFS took ${d.t} steps against ${n.t} for nearest-frontier. Coordinating who goes where took ${c.t}.</div>`;
  }
  el.innerHTML = html;
}

async function speedupExperiment() {
  const btn = $("speedupBtn"), cv = $("speedup"), note = $("speedupNote"); btn.disabled = true; cv.style.display = "block";
  const strats = ["dfs", "nearest", "coord"], K = 8, res = {};
  for (const s of strats) res[s] = [];
  for (let k = 1; k <= K; k++) {
    for (const s of strats) {
      note.textContent = `simulating ${TEAMS[s].name} with ${k} agent${k > 1 ? "s" : ""}…`;
      await new Promise((r) => setTimeout(r, 0));
      res[s].push(runTeamHeadless(s, k));
    }
    drawSpeedup(cv, res, K);
  }
  const t1 = res.coord[0], t8 = res.coord[K - 1];
  note.textContent = `Coordinated frontiers: ${t1} steps with one agent, ${t8} with eight, a ${(t1 / t8).toFixed(1)}× speedup for 8× the agents. The dashed line is the perfect 1/k speedup. Corridors can't be split, so returns diminish.`;
  btn.disabled = false;
}
function drawSpeedup(cv, res, K) {
  const dpr = Math.min(devicePixelRatio || 1, 2); cv.width = cv.clientWidth * dpr; cv.height = cv.clientHeight * dpr;
  const g = cv.getContext("2d"), W = cv.width, H = cv.height, pad = { l: 40 * dpr, r: 8 * dpr, t: 8 * dpr, b: 22 * dpr };
  const all = Object.values(res).flat().filter(Number.isFinite), maxY = Math.max(10, ...all);
  g.fillStyle = "#121418"; g.fillRect(0, 0, W, H);
  g.font = `${10 * dpr}px JetBrains Mono, monospace`; g.fillStyle = "#9a9ea6"; g.strokeStyle = "rgba(255,255,255,.12)";
  for (let k = 1; k <= K; k++) { const x = pad.l + (k - 1) / (K - 1) * (W - pad.l - pad.r); g.textAlign = "center"; g.fillText(k, x, H - 6 * dpr); }
  for (const p of [0, 0.5, 1]) { const y = pad.t + (1 - p) * (H - pad.t - pad.b); g.beginPath(); g.moveTo(pad.l, y); g.lineTo(W - pad.r, y); g.stroke(); g.textAlign = "right"; g.fillText(Math.round(p * maxY), pad.l - 5 * dpr, y + 3 * dpr); }
  const X = (k) => pad.l + (k - 1) / (K - 1) * (W - pad.l - pad.r), Yv = (v) => pad.t + (1 - v / maxY) * (H - pad.t - pad.b);
  if (res.coord.length) { g.setLineDash([4 * dpr, 4 * dpr]); g.strokeStyle = "rgba(126,224,138,.6)"; g.lineWidth = 1.2 * dpr; g.beginPath(); for (let k = 1; k <= K; k++) { const v = res.coord[0] / k; k === 1 ? g.moveTo(X(k), Yv(v)) : g.lineTo(X(k), Yv(v)); } g.stroke(); g.setLineDash([]); }
  for (const [s, arr] of Object.entries(res)) {
    g.strokeStyle = TEAMS[s].color; g.fillStyle = TEAMS[s].color; g.lineWidth = 2 * dpr; g.beginPath();
    arr.forEach((v, i) => { if (!Number.isFinite(v)) return; i ? g.lineTo(X(i + 1), Yv(v)) : g.moveTo(X(i + 1), Yv(v)); }); g.stroke();
    arr.forEach((v, i) => { if (Number.isFinite(v)) { g.beginPath(); g.arc(X(i + 1), Yv(v), 2.5 * dpr, 0, 7); g.fill(); } });
  }
}

// ===================================================================
//  editing: paint walls / mud, drag start & goal (single board, not while running)
// ===================================================================
function attachEditing(cv) {
  let mode = null;
  const cellAt = (e) => {
    const R = runs[0], r = cv.getBoundingClientRect(), dpr = cv.width / r.width;
    const x = Math.floor(((e.clientX - r.left) * dpr - R.ox) / R.cs), y = Math.floor(((e.clientY - r.top) * dpr - R.oy) / R.cs);
    return x > 0 && y > 0 && x < G.cols - 1 && y < G.rows - 1 ? idx(x, y) : -1;
  };
  cv.onpointerdown = (e) => {
    const i = cellAt(e); if (i < 0) return;
    cv.setPointerCapture(e.pointerId);
    if (i === G.start) mode = "start"; else if (i === G.goal && tab !== "team") mode = "goal";
    else { mode = "paint"; paintCell(i); }
  };
  cv.onpointermove = (e) => {
    if (!mode) return; const i = cellAt(e); if (i < 0) return;
    if (mode === "paint") paintCell(i);
    else if (G.cells[i] !== WALL && i !== G.start && i !== G.goal) { if (mode === "start") G.start = i; else G.goal = i; resetRuns(); }
  };
  cv.onpointerup = () => { if (mode) { mode = null; resetRuns(); } };
}
function paintCell(i) {
  if (i === G.start || i === G.goal) return;
  const m = $("paint").value, v = tab !== "known" ? (m === "erase" ? FREE : WALL) : m === "wall" ? WALL : m === "mud" ? MUD : FREE;
  if (G.cells[i] === v) return;
  G.cells[i] = v; playing = false; syncPlay(); resetRuns(true);
}

// ===================================================================
//  loop + controls
// ===================================================================
let optCache = 0;
function resetRuns(keepPaused) { optCache = optimalCost(); makeRuns(); if (!keepPaused) { playing = true; syncPlay(); } }
function newMaze() {
  const [c, r] = $("mazeSize").value.split("x").map(Number); G.cols = c; G.rows = r;
  rng = Math.random; genMaze($("mazeType").value);
  if (mudOn && tab === "known") sprinkleMud();
  resetRuns();
}
function syncPlay() { $("play").textContent = playing ? "⏸ pause" : "▶ play"; $("play").classList.toggle("on", !playing); }
const stepsPerSec = () => { const v = +$("speed").value / 100; return Math.round(2 * Math.pow(600, v)); };
function stepRun(R) {
  if (R.done) return;
  if (R.kind === "search") { const r = R.gen.next(); if (r.done) R.done = true; }
  else if (R.kind === "solo") stepSolo(R);
  else stepTeam(R);
}
let acc = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing && runs.some((R) => !R.done)) {
    acc += dt * stepsPerSec();
    let n = Math.floor(acc); acc -= n; n = Math.min(n, 4000);
    for (let k = 0; k < n; k++) for (const R of runs) stepRun(R);
    if (n) { drawAll(); highlightCode(); }
    if (runs.every((R) => R.done)) { playing = false; syncPlay(); renderSummary(); }
  }
  requestAnimationFrame(frame);
}

$("tabs").querySelectorAll("button").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab; $("tabs").querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
  if (tab !== "known") for (let i = 0; i < G.cells.length; i++) if (G.cells[i] === MUD) G.cells[i] = FREE;
  resetRuns();
});
$("newMaze").onclick = newMaze;
$("mazeType").onchange = newMaze;
$("mazeSize").onchange = newMaze;
$("mudBtn").onclick = () => { mudOn = true; sprinkleMud(); resetRuns(); };
$("play").onclick = () => { if (runs.every((R) => R.done)) resetRuns(); else { playing = !playing; syncPlay(); } };
$("stepBtn").onclick = () => { playing = false; syncPlay(); for (const R of runs) stepRun(R); drawAll(); highlightCode(); };
$("reset").onclick = () => resetRuns();
$("compare").onchange = (e) => { compare = e.target.checked; resetRuns(); };
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(sizeBoards, 100); });

if (innerWidth < 600) $("mazeSize").value = "21x13";
newMaze();
syncPlay();
requestAnimationFrame(frame);
</script>
</body>
</html>
