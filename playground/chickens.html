<script>
// ===================================================================
//  basics
// ===================================================================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

function vnoise(x, y) {

const isTouch = matchMedia("(pointer: coarse)").matches;
const smallScreen = innerWidth < 760 || isTouch;

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
const HORIZON = 0xeef0dc, SKY = 0x9fcbea;
scene.background = new THREE.Color(HORIZON);
scene.fog = new THREE.Fog(HORIZON, 22, 70);
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 500);

// warm, gentle light
const hemi = new THREE.HemisphereLight(0xdfeeff, 0x9c8a5a, 0.62);
const amb = new THREE.AmbientLight(0xfff1dc, 0.1);
const sun = new THREE.DirectionalLight(0xffe8c4, 0.78);
sun.position.set(5.5, 10, 7.5);
sun.castShadow = true;
sun.shadow.mapSize.set(smallScreen ? 1024 : 2048, smallScreen ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -6.5, right: 6.5, top: 6.5, bottom: -6.5, near: 0.5, far: 40 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.015;
scene.add(hemi, amb, sun, sun.target);

// sky dome
{
  const g = new THREE.SphereGeometry(220, 24, 12), p = g.attributes.position, col = new Float32Array(p.count * 3);
  const top = new THREE.Color(SKY), hor = new THREE.Color(HORIZON), c = new THREE.Color();
  for (let i = 0; i < p.count; i++) { const t = Math.pow(clamp(p.getY(i) / 220, 0, 1), 0.55); c.copy(hor).lerp(top, t); col.set([c.r, c.g, c.b], i * 3); }
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide, fog: false, depthWrite: false })));
}

// ===================================================================
//  low-poly helpers: every static thing is baked into a few big
//  flat-shaded, vertex-coloured meshes
// ===================================================================
const _o = new THREE.Object3D(), _a = new THREE.Vector3(), _b = new THREE.Vector3(), _c = new THREE.Vector3(), _n = new THREE.Vector3(), _e = new THREE.Vector3();
function mat4(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  _o.position.set(x, y, z); _o.rotation.set(rx, ry, rz); _o.scale.set(sx, sy, sz); _o.updateMatrix(); return _o.matrix.clone();
}
class Bake {

  add(geo, color, m, j = 0.07) {
    const g = geo.index ? geo.toNonIndexed() : geo, p = g.attributes.position, col = new THREE.Color(color);

      _a.fromBufferAttribute(p, i).applyMatrix4(m); _b.fromBufferAttribute(p, i + 1).applyMatrix4(m); _c.fromBufferAttribute(p, i + 2).applyMatrix4(m);
      _n.subVectors(_b, _a).cross(_e.subVectors(_c, _a)).normalize();
      const t = 1 + (Math.random() - 0.5) * j;
      for (const v of [_a, _b, _c]) { this.p.push(v.x, v.y, v.z); this.n.push(_n.x, _n.y, _n.z); this.c.push(col.r * t, col.g * t, col.b * t); }

  }

    g.setAttribute("position", new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute("normal", new THREE.Float32BufferAttribute(this.n, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(this.c, 3));

// a box whose top slopes from hF (front, +z) to hB (back, -z); base at y = 0

}

// ===================================================================
//  layout (metres). The run is a square: brick walls on the west and
//  north sides; along the north wall the bricks stop, then a little
//  storage shed, then the coop. East and south sides are chicken wire.
// ===================================================================
const RUN = { x0: -3.5, x1: 3.55, z0: -3.5, z1: 3.55 };
const SHED = { x0: 0.2, x1: 1.72, z0: -3.76, z1: -2.38, hF: 2.05, hB: 1.85 };
const COOP = { x0: 1.77, x1: 3.47, z0: -3.6, z1: -2.5, floor: 0.5, hF: 1.36, hB: 1.2 };
const RAMP = { x: 2.2, zTop: -2.5, zBot: -1.6, hTop: 0.5 };
const TREE = { x: -0.75, z: 2.7 };
const WATER = { x: -2.8, z: -2.75 };
const LOG = { x: -2.9, z: 0.8 };
const RECTS = [[SHED.x0, SHED.x1 + 0.03, -3.8, SHED.z1], [RAMP.x - 0.17, RAMP.x + 0.17, RAMP.zTop, RAMP.zBot], [LOG.x - 0.1, LOG.x + 0.1, LOG.z - 0.45, LOG.z + 0.45]];
const RECTS_TALL = RECTS.concat([[COOP.x0, COOP.x1, COOP.z0, COOP.z1]]);   // the rooster is too tall to walk under the coop
const CIRCLES = [[TREE.x, TREE.z, 0.11], [WATER.x, WATER.z, 0.21], [1.82, -3.55, 0.045], [3.42, -3.55, 0.045], [1.82, -2.55, 0.045], [3.42, -2.55, 0.045]];
const PATCHES = [[TREE.x, 2.5, 1.05, 0.8], [2.25, -1.3, 0.95, 0.62], [-2.75, -2.6, 0.8, 1.0], [0.7, 0.3, 0.5, 0.42], [1.0, -1.95, 0.75, 0.42], [3.15, 1.0, 0.34, 1.7], [2.6, -2.95, 0.95, 0.6], [-3.1, 0.8, 0.45, 0.9]];
function dirt(x, z) {
  let m = 0; const nz = (vnoise(x * 2.2 + 3, z * 2.2 + 7) - 0.5) * 0.6;
  for (const [px, pz, rx, rz] of PATCHES) { const d = Math.hypot((x - px) / rx, (z - pz) / rz) + nz; m = Math.max(m, clamp((1 - d) / 0.3, 0, 1)); }

}
function pushOut(o, r, tall) {

    if (d >= r) continue;

      const e = [o.x - q[0], q[1] - o.x, o.z - q[2], q[3] - o.z], m = Math.min(...e);

    } else { o.x = cx + dx / d * r; o.z = cz + dz / d * r; }
  }
  for (const [cx, cz, cr] of CIRCLES) {
    const dx = o.x - cx, dz = o.z - cz, d = Math.hypot(dx, dz), m = cr + r;
    if (d < m) { if (d < 1e-6) o.x += m; else { o.x = cx + dx / d * m; o.z = cz + dz / d * m; } }
  }
  o.x = clamp(o.x, RUN.x0 + r, RUN.x1 - r); o.z = clamp(o.z, RUN.z0 + r, RUN.z1 - r);
  return o;
}

// ===================================================================
//  ground: faceted grass mosaic, dirt patches where the hens scratch
// ===================================================================
const COL = {
  grass: [0x8fbf5c, 0x86b754, 0x9cc866, 0x7fb04f], grassOut: [0x93c25e, 0x88b956, 0xa0ca69, 0x84b452],
  dirt: [0xb78f66, 0xab845d, 0xc29b70], brick: [0xc9826a, 0xbf7760, 0xd08c70, 0xb86f5a], coping: 0xdcd1bc,
  shed: 0x9a6a48, shedDark: 0x7e5538, coop: 0xe2b880, coopTrim: 0xa8744c, coopRoof: 0xc4685a, shedRoof: 0x5d6672,
  post: 0x9c7552, bark: 0x8a6448, leaf: [0x7fb04e, 0x70a447, 0x8fc05a, 0x86b952],
};
const runGround = (() => {
  const S = 7.3, N = 40, g = new THREE.PlaneGeometry(S, S, N, N).rotateX(-Math.PI / 2).toNonIndexed(), p = g.attributes.position;
  const col = new Float32Array(p.count * 3), c = new THREE.Color();
  for (let i = 0; i < p.count; i += 3) {
    const cx = (p.getX(i) + p.getX(i + 1) + p.getX(i + 2)) / 3, cz = (p.getZ(i) + p.getZ(i + 1) + p.getZ(i + 2)) / 3, d = dirt(cx, cz), n = fbm(cx * 0.9 + 4, cz * 0.9);
    if (d > 0.5 + (hash2(cx * 9, cz * 7) - 0.5) * 0.5) c.set(COL.dirt[Math.floor(hash2(cx * 3, cz * 5) * 3)]);
    else { c.set(COL.grass[Math.floor(hash2(cx * 5, cz * 3) * 4)]); c.offsetHSL(0, 0, (n - 0.5) * 0.08 - d * 0.04); }
    const t = 1 + (Math.random() - 0.5) * 0.06;
    for (let k = 0; k < 3; k++) col.set([c.r * t, c.g * t, c.b * t], (i + k) * 3);
  }

// the rest of the garden, gently rolling further out

  const ng = g.toNonIndexed(), q = ng.attributes.position, col = new Float32Array(q.count * 3), c = new THREE.Color();
  for (let i = 0; i < q.count; i += 3) {
    const cx = (q.getX(i) + q.getX(i + 1) + q.getX(i + 2)) / 3, cz = (q.getZ(i) + q.getZ(i + 1) + q.getZ(i + 2)) / 3;
    c.set(COL.grassOut[Math.floor(hash2(cx * 5, cz * 3) * 4)]); c.offsetHSL(0, 0, (fbm(cx * 0.2, cz * 0.2) - 0.5) * 0.08);
    const t = 1 + (Math.random() - 0.5) * 0.05;
    for (let k = 0; k < 3; k++) col.set([c.r * t, c.g * t, c.b * t], (i + k) * 3);
  }
  ng.setAttribute("color", new THREE.BufferAttribute(col, 3)); ng.computeVertexNormals();
  const m = new THREE.Mesh(ng, new THREE.MeshLambertMaterial({ vertexColors: true })); m.receiveShadow = true; scene.add(m); return m;
})();

// ===================================================================
//  walls, sheds, coop, fences, tree, props
// ===================================================================
const structures = new THREE.Group(); scene.add(structures);
const W = new Bake();   // everything that casts shadows near the run

// brick walls (flat colour with a few proud bricks for texture) and a stone coping
function brickWall(x0, z0, x1, z1, h) {
  const len = Math.hypot(x1 - x0, z1 - z0), ang = Math.atan2(-(z1 - z0), x1 - x0), cx = (x0 + x1) / 2, cz = (z0 + z1) / 2;

  W.box(COL.coping, len + 0.04, 0.07, 0.32, 0, h + 0.035, 0, 0, 0, 0, P, 0.05);
  W.box(0xb9b09e, len + 0.02, 0.12, 0.27, 0, 0.06, 0, 0, 0, 0, P, 0.05);   // plinth

    const row = Math.floor(Math.random() * courses), y = 0.16 + row * 0.075, x = (Math.floor(Math.random() * (len / 0.225)) + (row % 2) * 0.5) * 0.225 - len / 2 + 0.11;

brickWall(-3.62, -3.74, -3.62, 3.62, 1.6);          // west
brickWall(-3.74, -3.62, SHED.x0 + 0.02, -3.62, 1.6); // north, up to the shed

// storage shed: vertical boards, pent roof, ledged door, small window
{
  const S = SHED, w = S.x1 - S.x0, d = S.z1 - S.z0, cx = (S.x0 + S.x1) / 2, cz = (S.z0 + S.z1) / 2;

  const bw = 0.135;
  for (let x = S.x0 + bw / 2; x < S.x1; x += bw) W.box(COL.shed, bw - 0.008, S.hF, 0.03, x, S.hF / 2, S.z1 - 0.01, 0, 0, 0, null, 0.12);
  for (const sx of [S.x0 + 0.01, S.x1 - 0.01]) for (let z = S.z0 + bw / 2; z < S.z1; z += bw) {

  // door
  const dx = cx + 0.05, dz = S.z1 + 0.025;
  for (let i = 0; i < 5; i++) W.box(COL.shedDark, 0.142, 1.72, 0.03, dx - 0.284 + i * 0.142, 0.9, dz, 0, 0, 0, null, 0.1);
  W.box(0x8b6040, 0.68, 0.1, 0.03, dx, 0.32, dz + 0.025); W.box(0x8b6040, 0.68, 0.1, 0.03, dx, 1.5, dz + 0.025);
  W.box(0x8b6040, 0.1, 1.2, 0.03, dx, 0.91, dz + 0.025, 0, 0, 0.5);
  W.box(0x3b3b3e, 0.03, 0.12, 0.03, dx + 0.25, 1.0, dz + 0.05);
  for (const y of [0.32, 1.5]) W.box(0x3b3b3e, 0.32, 0.03, 0.012, dx - 0.2, y, dz + 0.045);
  // window on the west side

  W.box(0x58738c, 0.045, 0.4, 0.52, S.x0 - 0.025, 1.35, cz + 0.1, 0, 0, 0, null, 0.02);
  W.box(0xf1ead8, 0.05, 0.4, 0.035, S.x0 - 0.026, 1.35, cz + 0.1); W.box(0xf1ead8, 0.05, 0.035, 0.52, S.x0 - 0.026, 1.35, cz + 0.1);

// the coop: raised on legs, pent roof, pop-hole with sliding door, ramp, nest box with the lid propped open
const NEST = { x0: 2.86, x1: 3.4, z0: -2.5, z1: -2.18, y0: 0.6, straw: 0.66 };
{
  const C = COOP, w = C.x1 - C.x0, d = C.z1 - C.z0, cx = (C.x0 + C.x1) / 2, cz = (C.z0 + C.z1) / 2;
  for (const [x, z] of [[C.x0 + 0.05, C.z0 + 0.05], [C.x1 - 0.05, C.z0 + 0.05], [C.x0 + 0.05, C.z1 - 0.05], [C.x1 - 0.05, C.z1 - 0.05]]) W.box(COL.coopTrim, 0.07, C.floor + 0.05, 0.07, x, (C.floor + 0.05) / 2, z);

      { const c = b.st % 1.6; if (c < 0.6) { T.pitch = st.pitch + 0.3; T.head.set(0, 0.1, 0.24); T.hp = 0.9; T.headK = 14; } else { T.head.set(0, st.hy + 0.03, st.hz - 0.03); T.hp = -0.75; T.headK = 10; } }
      if (b.st > 4.7) think(b);
      break;
    case "crow":
      b.speed = damp(b.speed, 0, 10, dt); b.st += dt;
      if (b.st < 0.7) { T.wingL = T.wingR = 0.3; T.flap = Math.abs(Math.sin(b.st * 18)) * 0.6; T.pitch = st.pitch - 0.1; }
      else if (b.st < 2.6) { T.hip = st.hip + 0.02; T.pitch = st.pitch - 0.22; T.head.set(0, 0.5, 0.12); T.hp = -0.85; T.headK = 5; }
      if (b.st > b.t) think(b);
      break;
    case "chase": {
      const o = b.other;
      if (!o || o.state !== "flee" || (b.t -= dt) < 0) { think(b); break; }
      walkTo(b, o.x, o.z, 0.95, dt, 0.25);
      T.pitch = st.pitch + 0.25; T.head.set(0, st.hy - 0.06, st.hz + 0.07); T.wingL = T.wingR = 0.2;
      break;
    }
    case "flee": {
      const o = b.other;
      if (!o || (b.t -= dt) < 0) { setState(b, Math.random() < 0.5 ? "preen" : "idle"); break; }
      let ax = b.x - o.x, az = b.z - o.z; const L = Math.hypot(ax, az) || 1; ax /= L; az /= L;
      let tx = b.x + ax, tz = b.z + az;
      if (!isFree(tx, tz, 0.2, b.rooster)) { const s = b.side; tx = b.x + (ax * 0.3 - az * s), tz = b.z + (az * 0.3 + ax * s); }
      walkTo(b, tx, tz, 1.05, dt, 0.01);
      T.pitch = st.pitch + 0.15; T.wingL = T.wingR = 0.3; T.flap = Math.sin(simT * 26) * 0.3;
      break;
    }
    case "eat": {
      if (b.full || landed === 0) { if (landed === 0 && airborne > 0 && !b.full) { b.speed = damp(b.speed, 0, 8, dt); lookAround(b, T, dt); break; } think(b); break; }
      if (!b.food || !grains.includes(b.food)) { if (b.food) b.food.claims--; b.food = nearestGrain(b); if (!b.food) { think(b); break; } b.food.claims++; }
      const g = b.food, loc = toLocal(b, g.x, g.z), d = Math.hypot(g.x - b.x, g.z - b.z);
      if (loc.z < 0.12 || loc.z > 0.3 || Math.abs(loc.x) > 0.07) {
        const a = Math.atan2(g.x - b.x, g.z - b.z);
        walkTo(b, g.x - Math.sin(a) * 0.21 * b.s, g.z - Math.cos(a) * 0.21 * b.s, d > 1 ? 0.85 : 0.35, dt, 0.03);
        if (loc.z < 0.12 && d < 0.2) b.speed = -0.15;   // too close: shuffle back
        if (d > 1) { T.pitch = st.pitch + 0.15; T.wingL = T.wingR = 0.14; T.flap = Math.sin(simT * 22 + b.i) * 0.12; }
        b.pk = Math.min(b.pk, -0.05);
      } else {
        b.speed = damp(b.speed, 0, 12, dt); face(b, g.x, g.z, dt);
        if (peck(b, T, loc.x, loc.z, dt)) {
          const i = grains.indexOf(g); if (i >= 0) grains.splice(i, 1);
          b.crop = Math.min(1, b.crop + 0.1); b.food = null;
          if (b.crop >= 1) { b.full = true; b.digest = rand(60, 120); setState(b, Math.random() < 0.5 ? "preen" : "wander"); }
        }
      }
      break;
    }
    case "lay":
      if (b.sub === 0) {
        if (walking(b, dt)) break;
        b.speed = damp(b.speed, 0, 10, dt); face(b, RAMP.x, RAMP.zTop, dt); lookAround(b, T, dt);
        if (coopUser && coopUser !== b) { if ((b.wait += dt) > 20) setState(b, "layg"); break; }
        if (Math.abs(angDiff(b.yaw, Math.PI)) < 0.3 && Math.hypot(b.x - RAMP.x, b.z - (RAMP.zBot + 0.18)) < 0.25) { coopUser = b; b.sub = 1; b.noCollide = true; }
        else if (Math.hypot(b.x - RAMP.x, b.z - (RAMP.zBot + 0.18)) >= 0.25) b.goal = { x: RAMP.x, z: RAMP.zBot + 0.18, spd: 0.25 };
      } else if (b.sub === 1) {   // up the ramp
        b.x = damp(b.x, RAMP.x, 6, dt); b.yaw = damp(b.yaw, b.yaw + angDiff(b.yaw, Math.PI), 8, dt); b.speed = 0.22;
        T.pitch = st.pitch - 0.28; T.head.set(0, st.hy, st.hz + 0.03);
        if (b.z < RAMP.zTop - 0.06) { b.sub = 2; b.t = rand(14, 26); b.root.visible = false; b.speed = 0; }
      } else if (b.sub === 2) {   // inside the coop
        b.speed = 0; move = false;
        if ((b.t -= dt) < 0) {
          const free = NEST_SLOTS.filter((s) => !s.egg);
          if (free.length) { const s = pick(free); addEgg(s.x, NEST.straw, s.z, s); }
          b.sub = 3; b.root.visible = true; b.yaw = 0; b.z = RAMP.zTop - 0.06; b.x = RAMP.x;
        }
      } else {   // back down
        b.speed = 0.25; T.pitch = st.pitch + 0.25; T.head.set(0, st.hy - 0.03, st.hz + 0.04);
        if (b.z > RAMP.zBot + 0.15) { b.noCollide = false; coopUser = null; b.layCd = rand(300, 600); setState(b, "wander"); }
      }
      break;
    case "layg":
      if (walking(b, dt)) break;
      b.speed = damp(b.speed, 0, 8, dt);
      T.hip = 0.085; T.pitch = 0.03; T.head.set(0, 0.29, 0.1); T.fluff = 1.09; lookAround(b, T, dt, 3);
      if ((b.t -= dt) < 0) {
        const o = pushOut({ x: b.x - Math.sin(b.yaw) * 0.1 * b.s, z: b.z - Math.cos(b.yaw) * 0.1 * b.s }, 0.03);
        addEgg(o.x, 0, o.z, null); b.layCd = rand(300, 600);
        setState(b, "wander"); b.goal = spotNear(b.x, b.z, 1.6, 20, (x, z) => isFree(x, z, 0.16) && Math.hypot(x - o.x, z - o.z) > 0.6) || wanderSpot(b); b.goal.spd = 0.32;
      }
      break;
  }
  if (b.state !== "lay" && b.noCollide) { b.noCollide = false; b.root.visible = true; if (coopUser === b) coopUser = null; }

  // move
  if (move) {
    b.x += Math.sin(b.yaw) * b.speed * dt; b.z += Math.cos(b.yaw) * b.speed * dt;
    if (!b.noCollide) pushOut(b, 0.11 * b.s, b.rooster);
  }
  b.y = b.noCollide ? clamp((RAMP.zBot - b.z) / (RAMP.zBot - RAMP.zTop), 0, 1) * RAMP.hTop + 0.012 : 0;

  // legs: stepping cycle driven by speed
  const sp = Math.abs(b.speed), k = clamp(sp / 0.22, 0, 1);
  b.phase += dt * Math.max(sp, 0.0) * 26 / b.s + dt * k * 0.5;
  for (let i = 0; i < 2; i++) {
    const a = b.phase + i * Math.PI, kick = i ? b.cur.kickR : b.cur.kickL;
    let fz = Math.sin(a) * 0.055 * k * Math.sign(b.speed || 1), fy = Math.max(0, Math.cos(a)) * 0.03 * k;
    if (kick > 0.01) { fz = -0.1 * kick; fy = 0.025 * kick; }
    b.fp[i].set(i ? 0.042 : -0.042, fy, fz);
  }
  // head bob: hold still, then thrust forward with every step
  if (sp > 0.03 && !["sit", "sunbathe", "layg"].includes(b.state)) {
    const kb = clamp(sp / 0.2, 0, 1) * (sp > 0.6 ? 0.4 : 1), fr = ((b.phase / Math.PI) % 1 + 1) % 1;
    const off = fr < 0.72 ? lerp(0.024, -0.02, fr / 0.72) : lerp(-0.02, 0.024, (fr - 0.72) / 0.28);
    T.head.z += off * kb; T.head.y -= Math.abs(off) * 0.25 * kb; T.headK = Math.max(T.headK, 32);
  }
  if (b.state === "eat" || b.state === "chase") T.head.z += 0.03 * clamp(sp - 0.4, 0, 1);
  applyPose(b, dt);
}

const INV = new THREE.Matrix4(), HL = new THREE.Vector3(), NB = new THREE.Vector3(), HW = new THREE.Vector3(), FT = new THREE.Vector3(), UPV = new THREE.Vector3(0, 1, 0), TV = new THREE.Vector3();
function bone(m, a, b) {
  TV.subVectors(b, a); const L = TV.length(); m.position.copy(a);
  if (L > 1e-5) m.quaternion.setFromUnitVectors(UPV, TV.multiplyScalar(1 / L));
  m.scale.set(1, Math.max(L, 1e-4), 1);
}
function applyPose(b, dt) {
  const T = b.tgt, C = b.cur;
  C.hip = damp(C.hip, T.hip, 4, dt); C.pitch = damp(C.pitch, T.pitch, 6, dt); C.roll = damp(C.roll, T.roll, 3, dt);
  C.head.x = damp(C.head.x, T.head.x, T.headK, dt); C.head.y = damp(C.head.y, T.head.y, T.headK, dt); C.head.z = damp(C.head.z, T.head.z, T.headK, dt);
  C.hp = damp(C.hp, T.hp, T.headK * 0.7, dt); C.hyaw = damp(C.hyaw, T.hyaw, 10, dt); C.hroll = damp(C.hroll, T.hroll, 8, dt);
  C.wingL = damp(C.wingL, T.wingL, 4, dt); C.wingR = damp(C.wingR, T.wingR, 4, dt); C.flap = damp(C.flap, T.flap, 20, dt);
  C.fluff = damp(C.fluff, T.fluff, 2, dt); C.kickL = damp(C.kickL, T.kickL, 25, dt); C.kickR = damp(C.kickR, T.kickR, 25, dt);
  b.root.position.set(b.x, b.y, b.z); b.root.rotation.y = b.yaw;
  const bd = b.body; bd.position.y = C.hip; bd.rotation.set(C.pitch, 0, C.roll); bd.updateMatrix();
  const cb = b.crop; b.torso.scale.set((1 + 0.26 * cb) * C.fluff, (1 + 0.17 * cb) * C.fluff, (1 + 0.08 * cb) * C.fluff);
  INV.copy(bd.matrix).invert();
  HL.copy(C.head).applyMatrix4(INV);
  b.head.position.copy(HL); b.head.rotation.set(C.hp - C.pitch, C.hyaw, C.hroll);
  NB.copy(HL); NB.y -= 0.012; NB.z -= 0.012; bone(b.neck, SHOULDER, NB);
  for (let i = 0; i < 2; i++) {
    const w = b.wings[i], spread = i ? C.wingR : C.wingL, sgn = i ? 1 : -1;
    w.pv.rotation.z = sgn * (spread * (Math.PI / 2 - 0.3) + C.flap);
    w.pv.rotation.y = sgn * spread * 0.2;
    w.w.scale.set(0.024 * (1 - 0.4 * spread), 0.065 * (1 + 0.6 * spread), 0.125 * (1 + 0.1 * spread));
  }
  const legsOn = C.hip > 0.115;
  for (let i = 0; i < 2; i++) {
    b.legs[i].visible = b.feet[i].visible = legsOn;
    if (!legsOn) continue;
    HW.copy(HIPL[i]).applyMatrix4(bd.matrix); FT.copy(b.fp[i]); FT.y += 0.008;
    bone(b.legs[i], HW, FT); b.feet[i].position.copy(b.fp[i]);
  }
}
function separate() {
  for (let i = 0; i < birds.length; i++) for (let j = i + 1; j < birds.length; j++) {
    const a = birds[i], c = birds[j]; if (a.noCollide || c.noCollide) continue;
    const dx = c.x - a.x, dz = c.z - a.z, d = Math.hypot(dx, dz), m = 0.13 * (a.s + c.s);
    if (d < m && d > 1e-5) { const p = (m - d) / 2 / d; a.x -= dx * p; a.z -= dz * p; c.x += dx * p; c.z += dz * p; pushOut(a, 0.11 * a.s, a.rooster); pushOut(c, 0.11 * c.s, c.rooster); }
  }
}

// starting positions: a mix of activities so there is something to see straight away
birds.forEach((b, i) => {
  for (let k = 0; k < 50; k++) { b.x = rand(-2.8, 3); b.z = rand(-1.8, 2.8); if (isFree(b.x, b.z, 0.2, b.rooster) && !birds.some((o) => o !== b && o.i !== undefined && Math.hypot(o.x - b.x, o.z - b.z) < 0.5 && o !== b)) break; }
  if (i === 2) { b.full = true; b.crop = 0.8; b.digest = 70; }
  if (i === 3) { b.full = true; b.crop = 0.6; b.digest = 50; }
  setState(b, ["wander", "forage", "sunbathe", "sit", "scratch", "forage", "idle"][i]);
  if (i === 2 || i === 3) { const s = i === 2 ? sunnySpot(b) : shadeSpot(b); b.x = s.x; b.z = s.z; b.goal = null; b.restCd = 60; }
  const C = b.cur, st = b.stance;
  if (i === 2) { C.hip = 0.065; C.wingL = C.wingR = 1; C.fluff = 1.12; }
  if (i === 3) { C.hip = 0.085; C.fluff = 1.07; }
  applyPose(b, 0.016);
});

// ===================================================================
//  camera: drag to orbit, wheel / pinch to zoom, slow drift when idle
// ===================================================================
const cam = { th: 0.5, ph: 1.0, r: 10.5, target: new THREE.Vector3(0.1, 0.4, -0.15), idle: 0 };
let drag = null, pinch = null;
const pointers = new Map(), gl = renderer.domElement;
gl.addEventListener("pointerdown", (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); gl.setPointerCapture(e.pointerId); gl.classList.add("grabbing");
  if (pointers.size === 1) drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now() };
  else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), r: cam.r }; drag = null; }
});
gl.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) { const [a, b] = [...pointers.values()]; cam.r = clamp(pinch.r * pinch.d / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), 2.5, 22); cam.idle = 0; return; }
  if (!drag) return;
  cam.th -= (e.clientX - drag.x) * 0.006; cam.ph = clamp(cam.ph - (e.clientY - drag.y) * 0.004, 0.22, 1.45);
  drag.x = e.clientX; drag.y = e.clientY; cam.idle = 0;
});
const endPointer = (e) => {
  pointers.delete(e.pointerId);
  if (drag && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 7 && performance.now() - drag.t < 450) click(e);
  if (pointers.size < 2) pinch = null;
  if (!pointers.size) gl.classList.remove("grabbing");
  drag = null;
};
gl.addEventListener("pointerup", endPointer); gl.addEventListener("pointercancel", endPointer);
gl.addEventListener("wheel", (e) => { e.preventDefault(); cam.r = clamp(cam.r * Math.exp(e.deltaY * 0.001), 2.5, 22); cam.idle = 0; }, { passive: false });
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function click(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -e.clientY / innerHeight * 2 + 1); raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects([runGround, builtStatic, treeTop], true)[0];
  if (hit && hit.object === runGround) { throwFeed(hit.point.x, hit.point.z); hintbar.style.opacity = 0; }
}

// ===================================================================
//  panel
// ===================================================================
const $ = (id) => document.getElementById(id);
const panel = $("panel"), openBtn = $("openPanel"), hintbar = $("hintbar");
function setPanel(open) { panel.classList.toggle("hidden", !open); openBtn.hidden = open; }
$("closePanel").onclick = () => setPanel(false);
openBtn.onclick = () => setPanel(true);
addEventListener("keydown", (e) => { if ((e.key === "h" || e.key === "H") && !e.ctrlKey && !e.metaKey && !e.altKey) setPanel(panel.classList.contains("hidden")); });
document.querySelectorAll(".panel button, .fab").forEach((b) => b.addEventListener("click", () => b.blur()));
if (isTouch) hintbar.textContent = "Drag to look around · tap the grass to throw feed";
setPanel(!smallScreen);
setTimeout(() => (hintbar.style.opacity = 0), 10000);

// ===================================================================
//  loop
// ===================================================================
let viewOff = -1, portrait = false;
function resize() {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight;
  portrait = innerWidth < innerHeight; camera.fov = portrait ? 52 : 40; camera.updateProjectionMatrix(); viewOff = -1;
  if (portrait) cam.r = Math.max(cam.r, clamp(11 / (innerWidth / innerHeight) * 0.56, 10.5, 16));
}
addEventListener("resize", resize);

function step(dt) {
  simT += dt;
  updateGrains(dt);
  for (const b of birds) updateBird(b, dt);
  separate();
  updateEggs(dt);
  treeTop.rotation.z = Math.sin(simT * 0.6) * 0.008; treeTop.rotation.x = Math.sin(simT * 0.47 + 1) * 0.006;
}
function render(dt) {
  cam.idle += dt;
  if (cam.idle > 6 && !drag && !pinch) { cam.th += dt * 0.025; cam.ph = damp(cam.ph, 0.98 + Math.sin(simT * 0.05) * 0.08, 0.3, dt); }
  const r = cam.r;
  camera.position.set(cam.target.x + r * Math.sin(cam.ph) * Math.sin(cam.th), cam.target.y + r * Math.cos(cam.ph), cam.target.z + r * Math.sin(cam.ph) * Math.cos(cam.th));
  camera.lookAt(cam.target);
  const off = !panel.classList.contains("hidden") && innerWidth > 760 ? (panel.offsetWidth + 16) / 2 : 0;
  if (off !== viewOff) { viewOff = off; if (off) camera.setViewOffset(innerWidth, innerHeight, -off, 0, innerWidth, innerHeight); else camera.clearViewOffset(); }
  renderer.render(scene, camera);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  step(dt); render(dt);
  requestAnimationFrame(frame);
}
resize();
render(0);
requestAnimationFrame(frame);
</script>
<script>/* links to other websites open in a new tab */ document.querySelectorAll("a[href]").forEach((a) => { if (/^https?:$/.test(a.protocol) && a.origin !== location.origin) { a.target = "_blank"; a.rel = "noopener noreferrer"; } });</script>
