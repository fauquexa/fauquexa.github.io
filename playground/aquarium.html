const TOP = 58;                 // water surface height

// soft vertical gradient behind everything (it follows the camera)

const hemi = new THREE.HemisphereLight(0xf4efc8, 0x24402c, 0.75);

// caustic shimmer on upward faces + gentle sway for plants (injected into Lambert)
const CAUSTIC_GLSL = `

  p *= 0.09; vec2 q = p; float c = 0.0;
  for (int i = 0; i < 4; i++) {

    sh.uniforms.uTime = U.time;

      gl_FragColor.rgb += vec3(1.0, 0.95, 0.72) * causticAt(vCW.xz, uTime) * ${caustic.toFixed(3)} * max(vNY, 0.0) * (0.35 + 0.65 * getShadowMask()) * (0.55 + 0.45 * smoothstep(0.0, ${TOP.toFixed(1)}, vCW.y));

// ===================================================================
//  the creek bed
// ===================================================================
{
  const g = new THREE.PlaneGeometry(640, 560, 80, 70); g.rotateX(-Math.PI / 2);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) p.setY(i, floorH(p.getX(i), p.getZ(i)));
  const ng = g.toNonIndexed(), q = ng.attributes.position, col = new Float32Array(q.count * 3);
  const sand = new THREE.Color(0x8c7f5c), mud = new THREE.Color(0x6a5e42), dark = new THREE.Color(0x4c4b33), c = new THREE.Color();
  for (let i = 0; i < q.count; i += 3) {

    const n = vnoise(cx * 0.045 + 3, cz * 0.045);
    c.copy(sand).lerp(mud, clamp(n * 1.4 - 0.2, 0, 1));
    if (vnoise(cx * 0.02 - 7, cz * 0.02 + 2) > 0.62) c.lerp(dark, 0.5);
    c.offsetHSL(0, 0, (R() - 0.5) * 0.045);
    for (let k = 0; k < 3; k++) { col[(i + k) * 3] = c.r; col[(i + k) * 3 + 1] = c.g; col[(i + k) * 3 + 2] = c.b; }
  }
  ng.setAttribute("color", new THREE.BufferAttribute(col, 3)); ng.computeVertexNormals();
  const floor = new THREE.Mesh(ng, envMat({ caustic: 0.2 })); floor.receiveShadow = true; scene.add(floor);
}

// ===================================================================
//  mangrove roots, rocks, stubs, a fallen branch, leaf litter
// ===================================================================
const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();

const envG = new Geo();

const BARK = new THREE.Color(0x7a6350), ALGAE = new THREE.Color(0x5a6a3e);

const trees = [];

    if (inBox(x, z, 4)) continue;
    tube(envG, [V(x, TOP + 4, z), V(x + rr(-2, 2), (TOP + end) / 2, z + rr(-2, 2)), V(x + rr(-3, 3), end, z + rr(-3, 3))], 5, (t) => 0.6 * (1 - t * 0.85), rootCol, 6);

}
// pneumatophores: short stubs poking up out of the mud
function stub(x, z, h, r) {

for (const [tx, tz] of trees) for (let i = 0; i < 7; i++) {

}
for (let i = 0; i < 26; i++) { const x = rr(-BX - 10, BX + 10), z = rr(-BZ - 8, BZ + 30); stub(x, z, rr(1.5, 3.5), rr(0.35, 0.6)); }

// rocks with a bit of moss on top
function rock(x, z, s, seed) {

  const sy = rr(0.55, 0.8), sz = rr(0.8, 1.2), ry = R() * 6.28, cy = Math.cos(ry), sny = Math.sin(ry), base = floorH(x, z) - s * 0.15, pts = [];

    const px = pos.getX(i), py = pos.getY(i), pz = pos.getZ(i), n = 0.78 + vnoise(px * 1.6 + seed, py * 1.6 + pz * 1.2 + seed) * 0.45;

    pts.push(V(x + vx * cy - vz * sny, base + vy, z + vx * sny + vz * cy));

const LEAF = [0xb48a3c, 0x9a6c33, 0x8a8a45, 0xc29a4a, 0x7a5a30, 0xa07a3a];
for (let i = 0; i < 260; i++) {

//  plants (each clump is one mesh so it can sway as a whole)
// ===================================================================

      vmax = Math.max(vmax, f.cruise * (hd < f.L ? 1.2 : 1.9));
      if (hd < f.L * 0.1 + 1.2 || bd < f.L * 0.2) { removePellet(best); f.full = rand(60, 120); }
    }
  }
  // stay in the open water
  const yLo = floorH(p.x, p.z) + f.L * 0.18 + (seeking ? 0.6 : 3), yHi = TOP - 4 - f.L * 0.12;
  const wall = (v, lo, hi, k) => (v < lo ? (lo - v) * k : v > hi ? (hi - v) * k : 0), mx = f.L * 0.5;
  if (f.enter) { if (Math.abs(p.x) < BX - 8) f.enter = false; else acc.x -= Math.sign(p.x) * f.cruise * 1.5; }
  else acc.x += wall(p.x, -BX + mx, BX - mx, 3);
  acc.z += wall(p.z, -BZ + mx * 0.6, BZ - mx * 0.6, 3);
  acc.y += wall(p.y, yLo + 2, yHi - 2, 2.5);
  // move
  f.v.addScaledVector(acc, dt);
  f.v.y *= 1 - dt * 1.2;
  const sp = f.v.length(), vmin = f.cruise * 0.12;
  if (sp > vmax) f.v.multiplyScalar(Math.max(vmax / sp, 1 - dt * 2));
  else if (sp < vmin) { if (sp < 1e-3) f.v.set(rand(-1, 1), 0, rand(-1, 1)); f.v.setLength(vmin); }
  p.addScaledVector(f.v, dt);
  if (!f.enter) p.x = clamp(p.x, -BX - 4, BX + 4);
  p.z = clamp(p.z, -BZ - 4, BZ + 4); p.y = clamp(p.y, yLo, yHi);
  // face where it's going (pitch limited)
  T1.copy(f.v); const hz = Math.hypot(T1.x, T1.z); T1.y = clamp(T1.y, -0.45 * hz, 0.45 * hz);
  if (T1.lengthSq() > 1e-4) { tmpM.lookAt(T1, ZERO, UPV); tmpQ.setFromRotationMatrix(tmpM); f.g.quaternion.slerp(tmpQ, 1 - Math.exp(-dt * (sp > f.cruise * 1.5 ? 7 : 3.5))); }
  f.fwd.set(0, 0, 1).applyQuaternion(f.g.quaternion);
  // body: full fish are rounder, the big one is very round right after a meal
  const fatT = (f.full > 0 ? 0.3 * Math.min(1, f.full / 12) : 0) + (f.meal > 0 ? 0.6 * Math.min(1, f.meal / 8) : 0);
  f.fat += (fatT - f.fat) * Math.min(1, dt * 1.2);
  f.u.uFat.value = f.fat;
  const sk = Math.min(f.v.length() / f.cruise, 4);
  f.phase += dt * (2.5 + sk * 3.2);
  f.u.uPhase.value = f.phase; f.u.uAmp.value = 0.05 + 0.03 * Math.min(sk, 3.5);
  if (f.fade < 1) { f.fade = Math.min(1, f.fade + dt / 4); f.mat.opacity = f.fade; if (f.fade >= 1) { f.mat.transparent = false; f.mat.needsUpdate = true; } }
}

function step(dt) {
  simT += dt;
  const pred = fish.find((f) => f.big), others = fish.filter((f) => !f.big), live = others.filter((f) => f.dying < 0);
  if (!others.length) {                      // the big one is alone: wait, then a new group arrives
    H.mode = "idle"; H.prey = null;
    if (!H.wait) H.wait = rand(30, 60);
    H.alone += dt;
    if (H.alone >= H.wait) { releaseBatch(); H.alone = 0; H.wait = 0; H.next = huntDelay(); }
  } else if (H.mode === "idle") {
    if (live.length && live.every((f) => !f.enter)) H.next -= dt;
    if (H.next <= 0 && live.length) { H.prey = live.reduce((a, b) => (b.L < a.L ? b : a)); H.mode = "stalk"; H.t = 0; }
  } else {
    H.t += dt;
    const d = headOf(pred, T1).distanceTo(H.prey.g.position);
    if (H.mode === "stalk" && (d < 26 || H.t > 6)) { H.mode = "strike"; H.t = 0; }
    else if (H.mode === "strike" && d < H.prey.L * 0.45 + pred.L * 0.08 + 1.5 + Math.max(0, H.t - 6) * 0.6) catchPrey(pred, H.prey);
  }
  for (const f of fish.slice()) updateFish(f, dt, pred);
  for (const f of fish.slice()) if (f.dying > 0.35) removeFish(f);
  for (let i = pellets.length - 1; i >= 0; i--) {
    const pl = pellets[i], p = pl.m.position, fl = floorH(p.x, p.z) + 0.35; pl.age += dt;
    if (p.y > fl) { p.y = Math.max(fl, p.y + pl.vy * dt); p.x += Math.sin(simT * 1.5 + pl.ph) * dt * 0.5; pl.m.rotation.x += dt; }
    if (pl.age > 90) { const k = 1 - (pl.age - 90) / 3; if (k <= 0) removePellet(pl); else pl.m.scale.setScalar(k); }
  }
}

// ===================================================================
//  camera: drag to orbit, wheel / pinch to zoom, slow drift when idle
// ===================================================================
const cam = { th: 0, ph: 1.52, r: 125, target: new THREE.Vector3(0, 27, 0), idle: 0 };
let drag = null, pinch = null;
const pointers = new Map(), gl = renderer.domElement;
gl.addEventListener("pointerdown", (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY }); gl.setPointerCapture(e.pointerId);
  if (pointers.size === 1) { drag = { x: e.clientX, y: e.clientY, x0: e.clientX, y0: e.clientY, t: performance.now() }; gl.classList.add("dragging"); }
  else if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), r: cam.r }; drag = null; }
});
gl.addEventListener("pointermove", (e) => {
  if (!pointers.has(e.pointerId)) return; pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch && pointers.size === 2) { const [a, b] = [...pointers.values()]; cam.r = clamp((pinch.r * pinch.d) / Math.max(20, Math.hypot(a.x - b.x, a.y - b.y)), 55, 220); cam.idle = 0; return; }
  if (!drag) return;
  cam.th = clamp(cam.th - (e.clientX - drag.x) * 0.005, -1.1, 1.1);
  cam.ph = clamp(cam.ph - (e.clientY - drag.y) * 0.004, 1.2, 1.95);
  drag.x = e.clientX; drag.y = e.clientY; cam.idle = 0;
});
const endPointer = (e) => {
  pointers.delete(e.pointerId);
  if (drag && e.type === "pointerup" && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8 && performance.now() - drag.t < 450) feedAt(e.clientX, e.clientY);
  if (pointers.size < 2) pinch = null;
  drag = null; gl.classList.remove("dragging");
};
gl.addEventListener("pointerup", endPointer); gl.addEventListener("pointercancel", endPointer);
gl.addEventListener("wheel", (e) => { e.preventDefault(); cam.r = clamp(cam.r * Math.exp(e.deltaY * 0.001), 55, 220); cam.idle = 0; }, { passive: false });

const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
function feedAt(cx, cy) {
  ndc.set((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1); raycaster.setFromCamera(ndc, camera);
  // where the click crosses the vertical plane through the middle of the open water
  const n = V(camera.position.x - cam.target.x, 0, camera.position.z - cam.target.z).normalize();
  const pt = new THREE.Vector3();
  if (raycaster.ray.intersectPlane(new THREE.Plane().setFromNormalAndCoplanarPoint(n, cam.target), pt)) dropFood(pt.x, pt.z);
}

// ===================================================================
//  panel
// ===================================================================
const $ = (id) => document.getElementById(id);
const panel = $("panel"), openBtn = $("openPanel");
function setPanel(open) { panel.classList.toggle("hidden", !open); openBtn.hidden = open; }
$("closePanel").onclick = () => setPanel(false);
openBtn.onclick = () => setPanel(true);
addEventListener("keydown", (e) => { if ((e.key === "h" || e.key === "H") && !e.ctrlKey && !e.metaKey && !e.altKey) setPanel(panel.classList.contains("hidden")); });
setPanel(!(innerWidth < 760 || isTouch));
$("feed").onclick = (e) => { dropFood(rand(-30, 30), rand(-12, 12)); e.currentTarget.blur(); };
if (isTouch) { $("sub").textContent = "Eight perch in a mangrove creek. Tap the water to feed them."; $("hintbar").textContent = "Drag to look around · tap the water to feed"; $("howto").textContent = "Drag to look around, pinch to zoom."; }
setTimeout(() => ($("hintbar").style.opacity = 0), 9000);
const WORDS = ["No", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten"];
let statusKey = "";
function updateStatus() {
  const n = fish.filter((f) => f.dying < 0).length, entering = fish.some((f) => f.enter);
  const key = n + H.mode + (H.wait ? "w" : "") + entering;
  if (key === statusKey) return; statusKey = key;
  let s = `${WORDS[n] || n} perch in the creek.`;
  if (entering) s += " A new group is swimming in.";
  else if (n === 1) s = "The big perch is alone for now. More will arrive soon.";
  else if (H.mode !== "idle") s += " The big one is hunting.";
  $("status").textContent = s;
}

// ===================================================================
//  loop
// ===================================================================
let viewOff = -1;
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.fov = innerWidth < innerHeight ? 58 : 45; camera.updateProjectionMatrix(); viewOff = -1;
  if (innerWidth < innerHeight) cam.r = 110;
}
addEventListener("resize", resize);

const tmpO = new THREE.Object3D();
let last = performance.now(), bubT = 3;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000; U.time.value = t;
  step(dt);
  // camera
  cam.idle += dt;
  if (cam.idle > 5 && !drag) { cam.th += (Math.sin(t * 0.045) * 0.6 - cam.th) * dt * 0.25; cam.ph += (1.5 + Math.sin(t * 0.031) * 0.1 - cam.ph) * dt * 0.25; }
  const r = cam.r;
  camera.position.set(cam.target.x + r * Math.sin(cam.ph) * Math.sin(cam.th), cam.target.y + r * Math.cos(cam.ph), cam.target.z + r * Math.sin(cam.ph) * Math.cos(cam.th));
  camera.position.y = clamp(camera.position.y, floorH(camera.position.x, camera.position.z) + 4, TOP - 3);
  camera.lookAt(cam.target);
  sky.position.copy(camera.position);
  scene.fog.near = r * 0.12; scene.fog.far = r + 190;
  const off = !panel.classList.contains("hidden") && innerWidth > 760 ? (panel.offsetWidth + 16) / 2 : 0;
  if (off !== viewOff) { viewOff = off; if (off) camera.setViewOffset(innerWidth, innerHeight, -off, 0, innerWidth, innerHeight); else camera.clearViewOffset(); }
  // bubbles now and then from the mud by the roots
  bubT -= dt;
  if (bubT < 0 && bubbleSpots.length) { bubT = rand(2, 6); const s = bubbleSpots[Math.floor(Math.random() * bubbleSpots.length)]; emitBubbles(s, 2 + Math.floor(Math.random() * 4), 0.8); }
  let k = 0;
  for (const b of bubbles) {
    if (b.alive) { b.v = Math.min(b.v + dt * 3, 12); b.p.y += b.v * dt; b.p.x += Math.sin(t * 5 + b.ph) * dt * 1.0; b.p.z += Math.cos(t * 4 + b.ph) * dt * 0.8; if (b.p.y > TOP - 0.5) b.alive = false; }
    tmpO.position.copy(b.alive ? b.p : T1.set(0, -500, 0)); tmpO.scale.setScalar(b.s); tmpO.rotation.set(b.ph + t, b.ph, 0); tmpO.updateMatrix(); bubMesh.setMatrixAt(k++, tmpO.matrix);
  }
  bubMesh.instanceMatrix.needsUpdate = true;
  // drifting specks
  for (let i = 0; i < MOTES; i++) { const s = moteSeed[i]; moteP[i * 3] += Math.sin(t * 0.2 + s) * dt * 0.4; moteP[i * 3 + 1] += Math.cos(t * 0.15 + s * 2) * dt * 0.25; }
  moteGeo.attributes.position.needsUpdate = true;
  for (const ray of rays) { const u = ray.userData; ray.rotation.set(0, cam.th, u.slant); ray.material.opacity = u.base * (0.55 + 0.45 * Math.sin(t * 0.35 + u.phase)); }
  updateStatus();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// start: one big perch, six medium, one small
fish.push(makeFish("large"));
for (let i = 0; i < 6; i++) fish.push(makeFish("medium"));
fish.push(makeFish("small"));
fish.forEach(spawnInside);
resize();
requestAnimationFrame(frame);

// handle for checking the behaviour from the console
window.aquarium = { get fish() { return fish; }, hunt: H, step, dropFood, releaseBatch };
</script>
</body>
</html>
